[package]
name = "zensight-sensor-hostspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Zenoh sensor for machine-checked desired-state assertions (mounts, files, listeners, symlinks, content, permissions)"
license = "Apache-2.0"

[dependencies]
zenkey = { workspace = true }
zensight-common = { path = "../zensight-common" }
zensight-sensor-core = { path = "../zensight-sensor-core" }
hostname = "0.4"

# Async runtime
tokio = { workspace = true, features = ["full", "sync", "time"] }

# Zenoh
zenoh.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
json5.workspace = true

# CLI
clap = { workspace = true, features = ["derive"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow.workspace = true

# `content.matches` / expectation validation (#821). The vocabulary is closed
# and the sensor executes nothing; regex is its one matching engine.
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml.workspace = true

[[bin]]
name = "zensight-sensor-hostspec"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
