# SNMPv2-MIB system group — applies to every device (#531).
name = "generic-device"


oids = [
  "1.3.6.1.2.1.1.1.0", # sysDescr
  "1.3.6.1.2.1.1.2.0", # sysObjectID
  "1.3.6.1.2.1.1.3.0", # sysUpTime
  "1.3.6.1.2.1.1.4.0", # sysContact
  "1.3.6.1.2.1.1.5.0", # sysName
  "1.3.6.1.2.1.1.6.0", # sysLocation
]

walks = [
  "1.3.6.1.2.1.4.20.1.1", # ipAdEntAddr (identity evidence, #537)
]

[oid_names]
"1.3.6.1.2.1.4.20.1.1" = "ip/{index}/addr"
"1.3.6.1.2.1.1.1.0" = "system/descr"
"1.3.6.1.2.1.1.2.0" = "system/object_id"
"1.3.6.1.2.1.1.3.0" = "system/uptime"
"1.3.6.1.2.1.1.4.0" = "system/contact"
"1.3.6.1.2.1.1.5.0" = "system/name"
"1.3.6.1.2.1.1.6.0" = "system/location"

[oid_syntax]
"1.3.6.1.2.1.1.3.0" = "TimeTicks"
[match]
default = true
