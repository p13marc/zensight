# APC Rack PDU (PowerNet-MIB rPDU2, 1.3.6.1.4.1.318.1.1.26) — #955.
#
# There is no standard PDU MIB: RFC 1628 covers UPSes and stops at the
# outlet. So per-outlet state is per vendor, and each overlay maps its own
# tree onto the SAME metric names — `pdu/outlet/{index}/state`,
# `.../current_da` — so a rule, a dashboard and a query do not have to know
# which brand answered.
#
# Verified against PowerNet-MIB v4.5.8 (rPDU2 = hardware 26; rPDU2Outlet = 9;
# Switched = 2, Metered = 4; Device = 4). The switched table has the on/off
# state, the metered table the per-outlet current — a PDU may serve one, the
# other, or both, and an absent table stays absent.
name = "pdu-apc"

walks = [
  "1.3.6.1.4.1.318.1.1.26.9.2.3.1.3", # rPDU2OutletSwitchedStatusName
  "1.3.6.1.4.1.318.1.1.26.9.2.3.1.5", # rPDU2OutletSwitchedStatusState  off(1) on(2)
  "1.3.6.1.4.1.318.1.1.26.9.4.3.1.3", # rPDU2OutletMeteredStatusName
  "1.3.6.1.4.1.318.1.1.26.9.4.3.1.6", # rPDU2OutletMeteredStatusCurrent (0.1 A)
  "1.3.6.1.4.1.318.1.1.26.9.4.3.1.7", # rPDU2OutletMeteredStatusPower (W)
  "1.3.6.1.4.1.318.1.1.26.4.3.1.4",   # rPDU2DeviceStatusLoadState
  "1.3.6.1.4.1.318.1.1.26.4.3.1.5",   # rPDU2DeviceStatusPower (0.1 kW)
]

[oid_names]
"1.3.6.1.4.1.318.1.1.26.9.2.3.1.3" = "pdu/outlet/{index}/name"
"1.3.6.1.4.1.318.1.1.26.9.2.3.1.5" = "pdu/outlet/{index}/state"
"1.3.6.1.4.1.318.1.1.26.9.4.3.1.3" = "pdu/outlet/{index}/metered_name"
"1.3.6.1.4.1.318.1.1.26.9.4.3.1.6" = "pdu/outlet/{index}/current_da"
"1.3.6.1.4.1.318.1.1.26.9.4.3.1.7" = "pdu/outlet/{index}/power_w"
"1.3.6.1.4.1.318.1.1.26.4.3.1.4" = "pdu/device/{index}/load_state"
"1.3.6.1.4.1.318.1.1.26.4.3.1.5" = "pdu/device/{index}/power_dkw"
[match]
default = false
sys_object_id = ["1.3.6.1.4.1.318.1.3.4"] # APC rack PDU / rPDU2 cards
