# Synology DSM (SYNOLOGY-*-MIB, 1.3.6.1.4.1.6574) — #960, SYS-SUP-014.
#
# The client side of a NAS is already covered: `hostspec` asserts the mount is
# there with the right options, `sysinfo` publishes per-mount space, inodes and
# time-to-full, `probe` checks the service answers. What none of them can see
# is the appliance — which is why this extends `host-resources` rather than
# replacing it: hrStorage gives the capacity floor even on a box whose vendor
# MIB is off, and the vendor tree adds the array and disk health hrStorage has
# no concept of.
#
# Verified against SYNOLOGY-SYSTEM-MIB, SYNOLOGY-RAID-MIB and
# SYNOLOGY-DISK-MIB as shipped in librenms.
name = "nas-synology"
extends = ["host-resources"]

oids = [
  "1.3.6.1.4.1.6574.1.1.0",   # systemStatus     Normal(1) Failed(2)
  "1.3.6.1.4.1.6574.1.2.0",   # temperature (deg C)
  "1.3.6.1.4.1.6574.1.3.0",   # powerStatus      Normal(1) Failed(2)
  "1.3.6.1.4.1.6574.1.4.1.0", # systemFanStatus  Normal(1) Failed(2)
  "1.3.6.1.4.1.6574.1.4.2.0", # cpuFanStatus     Normal(1) Failed(2)
  "1.3.6.1.4.1.6574.1.5.1.0", # modelName
  "1.3.6.1.4.1.6574.1.5.3.0", # DSM version
]

walks = [
  "1.3.6.1.4.1.6574.3.1.1", # raidTable
  "1.3.6.1.4.1.6574.2.1.1", # diskTable
]

[oid_names]
"1.3.6.1.4.1.6574.1.1.0" = "nas/system/status"
"1.3.6.1.4.1.6574.1.2.0" = "nas/system/temperature_c"
"1.3.6.1.4.1.6574.1.3.0" = "nas/system/power_status"
"1.3.6.1.4.1.6574.1.4.1.0" = "nas/system/fan_status"
"1.3.6.1.4.1.6574.1.4.2.0" = "nas/system/cpu_fan_status"
"1.3.6.1.4.1.6574.1.5.1.0" = "nas/system/model"
"1.3.6.1.4.1.6574.1.5.3.0" = "nas/system/firmware"
"1.3.6.1.4.1.6574.3.1.1.2" = "nas/array/{index}/name"
"1.3.6.1.4.1.6574.3.1.1.3" = "nas/array/{index}/status"
"1.3.6.1.4.1.6574.3.1.1.4" = "nas/array/{index}/free_bytes"
"1.3.6.1.4.1.6574.3.1.1.5" = "nas/array/{index}/total_bytes"
"1.3.6.1.4.1.6574.3.1.1.6" = "nas/array/{index}/hotspare_count"
"1.3.6.1.4.1.6574.2.1.1.2" = "nas/disk/{index}/name"
"1.3.6.1.4.1.6574.2.1.1.3" = "nas/disk/{index}/model"
"1.3.6.1.4.1.6574.2.1.1.5" = "nas/disk/{index}/status"
"1.3.6.1.4.1.6574.2.1.1.6" = "nas/disk/{index}/temperature_c"
"1.3.6.1.4.1.6574.2.1.1.11" = "nas/disk/{index}/remaining_life_percent"
[match]
default = false
sys_object_id = ["1.3.6.1.4.1.6574"]
