[workspace]
resolver = "2"
members = [
    "zensight",
    "zensight-common",
    # The tiered time-series store, extracted from the GUI binary (#904). It
    # was `pub mod store` inside `zensight`, so the only process that could
    # read the history it wrote was the GUI that wrote it — and on a fleet
    # that GUI is open for minutes a week. Same graduation `zblob` made from
    # `zenoh-blob/` (see the note on its dependency below): a self-contained
    # concern with no caller-specific types, now shared by the frontend cache
    # and the headless historian.
    "zensight-store",
    # The fleet's telemetry history as a service (#906, epic #898). A headless
    # Zenoh application on SensorRunner: it subscribes the telemetry class,
    # writes zensight-store's tiers, and serves bounded range queries over
    # them. A host-origin PRODUCER, not a service origin — it writes no
    # single-writer fleet state, so two of them are ordinary RFC 05 §2.1
    # fan-in. It must not link zenkey-fleet (see the note on that dependency).
    "zensight-historian",
    "zensight-correlator",
    "zensight-sensor-core",
    "zensight-exporter-prometheus",
    "zensight-exporter-otel",
    "zensight-sensor-snmp",
    "zensight-sensor-logs",
    "zensight-sensor-netflow",
    "zensight-sensor-modbus",
    "zensight-sensor-sysinfo",
    "zensight-sensor-gnmi",
    "zensight-sensor-netlink",
    "zensight-sensor-netring",
    "zensight-sensor-parallax",
    # Dependency-free BTF reader shared by the eBPF crates (#682, #681):
    # a dev-dependency of the -ebpf-common crates (so it can never reach the
    # bpfel-unknown-none object) and a real one of the userspace sensors.
    "zensight-btf",
    "zensight-sensor-systemd",
    "zensight-sensor-hostspec",
    "zensight-sensor-pve",
    "zensight-sensor-container",
    "zensight-sensor-probe",
    # Out-of-band hardware health over Redfish (#953, epic #952). Nothing in
    # the tree read a power supply: sysinfo's `collect.power` is RAPL energy,
    # hwmon fans and battery capacity — a CPU-and-laptop surface. On rack
    # hardware whose sensors sit behind a BMC and never reach hwmon, ZenSight
    # reported nothing about temperature or fans either. Read-only, with the
    # same `the_slice_declares_no_write_surface` test pve and probe carry: a
    # monitor that can reset a chassis is a different threat model.
    "zensight-sensor-bmc",
    # EVALUATION ONLY (epic #415): Rerun visualization adapter prototype.
    # publish = false, nothing depends on it; may be removed wholesale if the
    # evaluation concludes "do not adopt" (docs/plans/rerun/).
    "zensight-rerun",
    # no_std types shared between the opt-in eBPF kernel programs and userspace.
    # Plain libs — build fine on stable; harmless in `cargo build --workspace`.
    # The eBPF *program* crates are also members so `aya-build` can resolve them
    # by `--package`, but they compile to empty host stubs off the `bpf` target
    # (aya-ebpf is target-gated) — `cargo build --workspace` on stable stays
    # green; the real programs are built only by the parent's build.rs via
    # aya-build under `--features ebpf` (#99/#114).
    "zensight-sensor-sysinfo-ebpf-common",
    "zensight-sensor-sysinfo-ebpf",
    "zensight-sensor-netlink-ebpf-common",
    "zensight-sensor-netlink-ebpf",
    # CI conformance harness (#744): stands a deployment up and runs
    # zenkey-fleet's RFC judges against it. publish = false. Links
    # zenkey-fleet, as does `zensight` for the fleet view (#745) — the
    # invariant is that no crate a SENSOR links may; see its README,
    # "The boundary", and the note on the dependency below.
    # The fleet policy compiler (#938, epic #902). `@desired` shipped in
    # 0.12.0 with a consumer, a storage stanza and a never-list, and nothing
    # in-tree that PUBLISHED a desired document — the author was a private
    # script somewhere else. This is the author: it reads one
    # fleet-policy.json5, asks @catalog what hosts exist, and publishes the
    # per-host documents that follow. A single-writer SERVICE origin, not a
    # producer, so it is the correlator's shape rather than the historian's.
    # It must not link zenkey-fleet (see the note on that dependency).
    "zensight-desired",
    "zensight-conformance",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/p13marc/zensight"
authors = ["Marc Pardo <p13marc@gmail.com>"]

[workspace.dependencies]
# Zenoh
zenoh = { version = "1.10", features = ["unstable"] }
zenoh-ext = { version = "1.10", features = ["unstable"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Hashing (blob integrity — promoted from a transitive pin)
sha2 = "0.10"

# Debug-report bundling + ids (zblob adapter, #196)
ulid = { version = "3", features = ["serde"] }
tar = "0.4"
zstd = "0.13"
tempfile = "3"

# Object-safe async traits (artifact producer registry, #332)
async-trait = "0.1"

# Host identity envelope (#301): hostname + local interface addresses
hostname = "0.4"
if-addrs = "0.15"

# Unit-name globbing: the systemd watchlist (#273) and the service-control
# allowlist (#283). Promoted to a workspace dep so the sensor's gate and the
# frontend's preview of it cannot compile against different glob semantics.
flume = "0.11"
glob = "0.3"
# hostspec's one matching engine (#821): `content.matches` + expectation
# validation. The GUI's own regex dep is version-pinned separately.
regex = "1"

# Configuration
json5 = "1.0"
# TOML, for the two places that read a registry file as data rather than
# through zenkey-build's generated surface: the SNMP MIB loader, and the
# parallax test that pins the declared rate ceiling against the interval the
# sensor enforces (#715) — a field zenkey-build 0.7 does not lint.
toml = "1.1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Platform utilities
dirs = "6"
# Native file dialogs (export save-as, #37). xdg-portal backend avoids a hard
# GTK system-lib dependency (uses the desktop portal over D-Bus via ashpd).
# rfd backend: async-std, NOT tokio — iced_tester (the `tester` feature) pulls
# rfd's default features, which pin ashpd/async-std; ashpd's tokio and
# async-std features are mutually exclusive, so feature unification with our
# own rfd dep must agree. The dialog futures are executor-agnostic — awaiting
# them from the tokio runtime is fine; only ashpd's internal reactor changes.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Desktop notifications for CRITICAL alert transitions (#26, opt-in). On Linux it
# uses the freedesktop notification spec over D-Bus (zbus, already pulled by rfd).
notify-rust = "4"

# eBPF (opt-in `ebpf` feature on sysinfo/netlink sensors only — #99/#114).
# Userspace side; the kernel side pulls aya-ebpf/aya-log-ebpf from the program
# crates. VERIFY-LATEST on crates.io before merging.
aya = "0.14"
aya-log = "0.3"
aya-build = "0.2"

# The video pipeline engine (lib name `parallax`) — the parallax sensor's
# encoder/source graph and the frontend's opt-in `h264` decoder. Promoted to a
# workspace dep (#727) so the sensor that *encodes* and the GUI that *decodes*
# can never drift onto two versions of the same bitstream contract. Default
# features are empty on purpose; each member opts into exactly what it needs.
parallax-pipeline = { version = "0.9.0", default-features = false }

# Internal crates
zensight-common = { path = "zensight-common" }
# The keyspace convention crate — external since the zenkey extraction (RFC set
# + zenctl live there too). crates.io dep (#517); registry TOMLs live in-repo
# (zensight-common/registry/), compiled at build time by zenkey-build.
zenkey = "0.7"
zenkey-build = "0.7"
# The upstream fleet engine: the RFC 05 §2.1 fan-in discipline, bounded and
# elision-reporting fan-out, declared queriers, registry-slice sets, RFC 13's
# `Judgement`, and the conformance judges `run_doctor` exposes.
#
# Two members link it and NOTHING ELSE MAY: `zensight` for the fleet view
# (#745/#746) and `zensight-conformance` for the CI judges (#744). It drags a
# full tokio + zenoh-ext + arc-swap + base64 + ciborium + serde_json tree, so it
# must never enter `zensight-common` or any crate a sensor links.
#
# `default-features = false` drops the `decode` seam (schema-aware payload
# decode) here, because the fleet view does not use it. `zensight-conformance`
# opts back in explicitly — its payload checks are exactly that seam — so the
# cost is declared at the crate that incurs it rather than paid fleet-wide by
# default.
#
# NOTE the package license is **Apache-2.0**, not the MIT of the zenkey
# workspace root it lives in. Nothing here is published, so the only
# obligation is attribution wherever a built binary ships.
zenkey-fleet = { version = "0.11", default-features = false }
schemars = "1"
# Draft-2020-12 payload conformance, behind zensight-common's `validate-json`
# feature (#741). `default-features = false` keeps the format/regex extras out.
jsonschema = { version = "0.49", default-features = false }
zensight-sensor-core = { path = "zensight-sensor-core" }
zensight-store = { path = "zensight-store" }
# Generic resumable chunked blob transfer over Zenoh (zero ZenSight types;
# graduated from in-tree `zenoh-blob/` — epic #193; renamed on extraction).
# 0.3 is wire v3: BLAKE3 + bao verified streaming, one postcard encoding,
# typed serve/query prefixes, batched tier-2 fetch and probes. v2 and v3 peers
# deliberately do not interoperate (chunk addresses are unchanged, so stores
# stay warm), so a fleet upgrades sensors and frontend together.
zblob = "0.3.0"

# The embedded store behind zensight-store, the GUI's metric cache and the logs
# sensor's durable ring. It was pinned per-crate and differently ("4" in the
# GUI, "4.1.0" in the logs sensor); with a third crate opening the same file
# formats that had to stop being three independent decisions.
redb = "4"
