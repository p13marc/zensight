# cargo-deny configuration (fleet standard, myserver#33: cargo-deny is the
# single supply-chain lint). See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# Transitive and unactionable here — dated, with the pin that traps each one.
# Re-check on every zenoh / iced / netring bump (last: 2026-09-09, #1098 —
# netring 0.29 -> 0.30, zenoh 1.10.0 -> 1.10.1, rerun 0.36 -> 0.37).
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin timing sidechannel — no fixed release exists (zenoh tree)
    "RUSTSEC-2023-0089", # atomic-polyfill unmaintained (via heapless, zenoh tree)
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (zenoh tree)
    "RUSTSEC-2024-0436", # paste unmaintained (zenoh tree)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (zenoh tree)
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained (zenoh tree)
    "RUSTSEC-2026-0041", # lz4_flex decompress leak — zenoh pins 0.10, fix is in a later minor
    # RUSTSEC-2026-0194/0195 (the quick-xml < 0.41 DoS pair) were dropped here
    # on 2026-09-09: wayland-scanner has moved off 0.39, the tree now carries
    # only 0.41/0.42, and cargo-deny reported both entries as
    # `advisory-not-detected`. An ignore that matches nothing is the stale
    # entry deny-fresh exists to find.
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (via resvg/usvg, iced tree)
    "RUSTSEC-2026-0206", # rustybuzz unmaintained (via resvg/usvg, iced tree)
    # wasmtime, via yara-x behind the opt-in netring/yara feature. RE-CHECKED
    # 2026-09-09 on the netring 0.30 bump, which is the event the previous note
    # named: netring 0.30 -> yara-x 1.20 -> wasmtime **45.0.3**, so the chain
    # moved off the 43 line as predicted — and the 45 line is unfixed too.
    # Neither advisory has a 45.x patched range (0222: >=24.0.12, >=36.0.13,
    # >=46.0.2, >=47.0.3; 0269: >=24.0.13, >=36.0.14, >=46.0.3, >=47.0.4), so
    # there is still no version of this chain that resolves them.
    # wasmtime here runs yara-x's own compiled rules — operator-authored, no
    # untrusted wasm, no WASI preopens — so both advisories' exposure is nil in
    # this use. Re-check when yara-x moves to a wasmtime 46/47; the weekly
    # deny-fresh run resurfaces these so they cannot rot silently.
    "RUSTSEC-2026-0222", # type-index mixup
    "RUSTSEC-2026-0269", # fs sandbox escape on trailing-slash paths (2026-08-31)
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    # Community Data License Agreement – Permissive 2.0. Used by
    # `webpki-roots` (the Mozilla CA bundle) in zenoh's TLS stack.
    "CDLA-Permissive-2.0",
    # Independent JPEG Group license (permissive) — `jpeg-encoder` in the
    # parallax sensor's image path.
    "IJG",
]
confidence-threshold = 0.8

# LGPL stays out of the general allowlist: it is accepted only for the two
# crates that dynamically link the system libsystemd (journald access in
# zensight-sensor-logs / -systemd).
[[licenses.exceptions]]
name = "libsystemd-sys"
allow = ["LGPL-2.1-or-later WITH GCC-exception-2.0"]

[[licenses.exceptions]]
name = "systemd"
allow = ["LGPL-2.1-or-later WITH GCC-exception-2.0"]

[bans]
# "warn", deliberately, re-examined in #845: denying needs a skip entry per
# duplicated crate (102 today, mostly the iced and zenoh trees) that rots on
# every dependency bump — a gate made of stale skips protects less than a
# warning someone reads. The audit's real finding was that NOTHING could
# surface a stale entry anywhere in this file; that is the scheduled
# deny-fresh workflow's job (.forgejo/workflows/deny-fresh.yml).
#
# It could not actually do it until #1097. Stripping the ignore list — the only
# thing that workflow did — REMOVES the `advisory-not-detected` warnings that
# name a stale entry, so the check that was supposed to find them could not.
# `scripts/deny-stale-entries.sh` now runs with this file intact and fails on
# any `*-not-detected` / `*-not-encountered` / `unmatched-*` warning, which
# covers the licenses.exceptions below and any future [bans] skip as well as
# the ignores above.
multiple-versions = "warn"
# The fleet skeleton says "deny", but this workspace wires its 25 members
# together with version-less path dependencies, and `allow-wildcard-paths`
# only exempts those in `publish = false` crates (most members do not set
# it). No external dependency uses a wildcard — checked 2026-08-29. Revisit
# if the members ever gain `publish = false` or explicit versions.
wildcards = "warn"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
