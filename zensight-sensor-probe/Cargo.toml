[package]
name = "zensight-sensor-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Zenoh sensor for outside-in synthetic checks — HTTP, TLS, DNS, TCP, optional ICMP, and local certificate expiry. A client only; no listeners, no action surface."
license = "Apache-2.0"

[features]
default = []
# ICMP needs a raw socket (CAP_NET_RAW or a privileged-port ping sysctl), so it
# follows the repo's convention for capability-needing collectors: a build
# feature, off by default, and a config switch on top of it. A default build is
# unprivileged, and `validate()` refuses an icmp target it cannot answer for.
icmp = ["dep:surge-ping"]

[dependencies]
zenkey = { workspace = true }
zensight-common = { path = "../zensight-common" }
zensight-sensor-core = { path = "../zensight-sensor-core" }
hostname = "0.4"

# Async runtime
tokio = { workspace = true, features = ["full", "sync", "time", "net"] }

# Zenoh
zenoh.workspace = true

# HTTP. rustls only — the same stack zensight-exporter-prometheus already
# ships, so no OpenSSL enters the tree.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "stream"] }

# The TLS half is deliberately NOT reqwest: reading a certificate's expiry,
# issuer and SANs means holding the peer's chain, and an HTTP client's job is
# to validate it and throw it away. tokio-rustls hands over the peer chain, and
# x509-parser reads it. The same parser reads a PEM off disk, so the socket and
# the file paths produce identical documents.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
x509-parser = "0.17"

# DNS, with the resolver named — the whole point of the check.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# ICMP, feature-gated.
surge-ping = { version = "0.8", optional = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
json5.workspace = true

# CLI
clap = { workspace = true, features = ["derive"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
toml.workspace = true
axum = "0.8"

[[bin]]
name = "zensight-sensor-probe"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
