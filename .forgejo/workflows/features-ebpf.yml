# The expensive tail of #662.
#
# `zensight-sensor-{netlink,sysinfo}` both carry an opt-in `ebpf` feature whose
# build script drives `aya-build` through `rustup run nightly`. Checking them
# therefore needs a nightly toolchain, `rust-src`, and a `bpf-linker` install on
# top of everything the normal CI job installs — far too much for every push,
# which is why ci.yml's `features` job deliberately stops at the eight features
# a stable toolchain can check.
#
# So they run here instead, nightly and on demand. The signal is slower than a
# per-push gate, and that is the accepted trade (#662 names it as the third and
# cheapest option). What matters is that a feature which stops compiling fails
# CI at all, rather than being discovered by the next person who happens to
# build it — which is exactly how `h264` was found broken a week late (#649).
name: eBPF features
on:
  schedule:
    # 04:17 UTC daily, well clear of the working day.
    - cron: '17 4 * * *'
  workflow_dispatch:
  # #674 landed a job that had never once run to completion, because nothing
  # but a manual dispatch can reach this file and a manual dispatch is easy not
  # to do. A path-filtered pull_request buys exactly one real run per edit of
  # this workflow and fires for nothing else — the per-push cost #662 declined
  # stays declined.
  pull_request:
    paths:
      - '.forgejo/workflows/features-ebpf.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  ebpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      # The workspace toolchain builds the userspace half...
      - uses: https://github.com/dtolnay/rust-toolchain@1.97
      # ...and nightly + rust-src builds the BPF object (bpfel-unknown-none is a
      # build-std target, hence rust-src). `aya-build` invokes it by name via
      # `rustup run nightly`, so it must be installed, not merely selected.
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ebpf
          cache-targets: false
      # `cargo install bpf-linker` builds an LLVM frontend, and llvm-sys wants a
      # *system* LLVM of the major version it was written against. The runner
      # image (ghcr.io/catthehacker/ubuntu:act-24.04) ships none, so the only
      # run this workflow ever had spent 70 s compiling and then died in that
      # build script: "could not find llvm-config in directories specified by
      # environment variable `PATH`" (#674). Installing an LLVM to satisfy it
      # would be the wrong fix — upstream says so itself, right before it dies:
      # a source build "is NOT recommended for regular users due to dependency
      # on specific LLVM version, system libraries and overall complexity of
      # getting the setup right".
      #
      # Take the published binary instead. The musl asset is a single
      # statically linked ~104 MB executable with LLVM baked in, 27 MB over the
      # wire. It is the same artifact `cargo binstall bpf-linker` would fetch,
      # minus having to install binstall first — and bpf-linker publishes no
      # [package.metadata.binstall], so binstall would be guessing the asset
      # URL from its default templates rather than reading it.
      #
      # It lands in /usr/local/bin, NOT $CARGO_HOME/bin: rust-cache caches
      # $CARGO_HOME/bin by default and deliberately keeps what a job installed,
      # so the old step was quietly a 104 MB cache entry — one keyed on a
      # lockfile hash that knows nothing about BPF_LINKER_VERSION, so it would
      # restore a stale binary on a bump and be overwritten anyway. There is no
      # sense pushing this through a cache to save a sub-second download.
      # /usr/local/bin is already on the runner's PATH, so no $GITHUB_PATH edit.
      #
      # curl and zstd are both in the act image's own package list, so the apt
      # line above is left alone. The archive holds a bare `bpf-linker` at its
      # root today, but that is a packaging detail upstream is free to change —
      # hence find(1) rather than an assumed path.
      - name: Install bpf-linker
        env:
          # renovate: datasource=github-releases depName=aya-rs/bpf-linker
          BPF_LINKER_VERSION: 0.11.0
        run: |
          set -euo pipefail
          url="https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused \
               --location --fail --silent --show-error \
               --output "$tmp/bpf-linker.tar.zst" "$url"
          tar --zstd -xf "$tmp/bpf-linker.tar.zst" -C "$tmp"
          bin="$(find "$tmp" -type f -name bpf-linker -print -quit)"
          if [ -z "$bin" ]; then
            echo "::error::no bpf-linker executable in $url — the archive layout changed"
            find "$tmp" -type f -printf '%M %10s %P\n'
            exit 1
          fi
          sudo install -m 0755 "$bin" /usr/local/bin/bpf-linker
          # The release build does not stamp its version (it self-reports
          # 0.0.0), so record the pin and prove the musl binary actually runs
          # on this image — which is the half that can fail.
          echo "bpf-linker ${BPF_LINKER_VERSION} installed: $(bpf-linker --version)"

      - name: netlink --features ebpf
        run: cargo check -p zensight-sensor-netlink --features ebpf --locked
      - name: sysinfo --features ebpf
        run: cargo check -p zensight-sensor-sysinfo --features ebpf --locked
