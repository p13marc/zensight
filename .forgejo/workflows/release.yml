name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # re-run a failed release without deleting/re-pushing the tag (fleet shape,
  # myserver#29). On dispatch the run executes on a BRANCH ref
  # (GITHUB_REF_NAME is e.g. "master"), so every step must use the resolved
  # RELEASE_TAG/RELEASE_SHA env instead.
  workflow_dispatch:
    inputs:
      tag:
        description: existing bare-semver tag to re-release
        required: true

env:
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

concurrency:
  # a re-dispatched release must queue behind the running one, not race it
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # NOTHING IS PUBLISHED UNTIL CI HAS PASSED ON THIS COMMIT (#1095).
  #
  # ci.yml also fires on the tag pattern, but in a different concurrency group,
  # and its own header calls that run a "parallel signal, not a gate" — so
  # images were built, smoke-tested and PUSHED while the suite might still be
  # running, or red. `workflow_run` exists in none of the four workflows on
  # this instance, so the gate is a poll of the commit's combined status.
  #
  # It reads RELEASE_SHA, never `github.sha`: on a workflow_dispatch this run
  # executes on a BRANCH ref while the thing being released is the tag, and
  # "the same SHA" has to mean the tag's commit or the gate checks the wrong
  # tree.
  #
  # THIS JOB HOLDS A RUNNER LANE WHILE IT WAITS, and on a tag push the thing it
  # waits for is ci.yml's run on that same tag — which needs lanes of its own.
  # That is survivable only because the runner has more than one (three
  # concurrent jobs observed), and it is bounded either way by the 80-minute
  # timeout below rather than hanging. If the fleet ever drops to a
  # single-lane runner, this becomes a deadlock and the gate has to move to a
  # separate runner label or a pre-tag check.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Wait for CI to pass on the release commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          sha=$(git rev-parse "$tag^{commit}")
          echo "gating on $tag -> $sha"

          # The token never reaches a command line (#1095): curl reads it from
          # a config file, so it is not in the runner's process table.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT

          # HOW MANY STATUSES TO EXPECT, counted from ci.yml itself rather
          # than hardcoded. A commit status appears when its job STARTS, and
          # with one runner the jobs queue — so early in a run the combined
          # state can be `success` over a single finished job while five have
          # not begun. Waiting for green over too few statuses is the exact
          # false-green this gate exists to prevent.
          want=$(awk '/^jobs:/{f=1;next} f && /^  [a-z0-9_-]+:$/{n++} END{print n+0}' \
                   .forgejo/workflows/ci.yml)
          echo "ci.yml declares $want jobs; the gate waits for that many statuses"
          [ "$want" -gt 0 ] || { echo "::error::could not count ci.yml's jobs"; exit 1; }

          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          # One runner, jobs queue serially across every open PR, so the tag's
          # own CI run can take a long while even to APPEAR. 80 * 60s.
          for i in $(seq 80); do
            body=$(curl -sf --config "$cfg" "$api/commits/$sha/status" || echo '{}')
            state=$(printf '%s' "$body" | jq -r '.state // "none"')
            n=$(printf '%s' "$body" | jq -r '(.statuses // []) | length')
            echo "[$i/80] combined state=$state over $n/$want status(es)"
            case "$state" in
              success)
                if [ "$n" -ge "$want" ]; then
                  printf '%s' "$body" | jq -r '.statuses[] | "  \(.context): \(.status)"'
                  echo "CI is green on $sha over all $n statuses — publishing"
                  exit 0
                fi
                echo "  green so far, but only $n of $want jobs have reported — still waiting" ;;
              failure|error)
                echo "::error::CI is $state on $sha; refusing to publish this release"
                printf '%s' "$body" | jq -r '.statuses[] | "  \(.context): \(.status)"'
                exit 1 ;;
            esac
            sleep 60
          done

          echo "::error::CI never reached a conclusion for $sha within 80 minutes."
          echo "A tag push starts ci.yml on the same ref; a workflow_dispatch of an OLD"
          echo "tag relies on the statuses recorded when that tag was pushed. If this"
          echo "commit legitimately has no CI run, push the tag rather than dispatching"
          echo "it, or record a status for $sha before re-dispatching."
          exit 1

  release:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - name: Build release artifacts
        run: |
          mkdir -p dist/release
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="${name}-${RELEASE_TAG}/" \
            -o "dist/release/${name}-${RELEASE_TAG}.tar.gz" "${RELEASE_TAG}"
      # no override: it recreates the release object and wipes every asset
      # already attached (lost the 0.9.0 bundle that way)
      - name: Create release if missing
        # API-driven so a workflow_dispatch re-run of an existing tag is
        # idempotent: forgejo-release@v2 tries to create and 409s when the
        # release already exists (proven by the nlink-lab 0.8.0 re-run).
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The token is read from a 0600 curl config, never passed as an
          # argv element (#1095) — `-H "Authorization: token $T"` is visible
          # in the runner's process table for the life of the request.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          if ! curl -sf --config "$cfg" "$api/releases/tags/${RELEASE_TAG}" >/dev/null; then
            curl -sf --config "$cfg" -X POST -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${RELEASE_SHA}\"}" \
              "$api/releases" >/dev/null
          fi
      - name: Attach release assets
        # delete-then-upload keeps re-runs idempotent; never override:true
        # (it recreates the release and wipes every asset)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `set -u` only, deliberately: the delete-then-upload loop below
          # tolerates a 404 from a missing asset, which is the normal
          # first-run case, and `-e` would abort on it.
          set -u
          # The token is read from a 0600 curl config, never passed as an
          # argv element (#1095) — `-H "Authorization: token $T"` is visible
          # in the runner's process table for the life of the request.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sf --config "$cfg" "$api/releases/tags/${RELEASE_TAG}" | jq -r .id)
          for f in dist/release/*; do
            name=$(basename "$f")
            for aid in $(curl -sf --config "$cfg" "$api/releases/$rid/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id'); do
              curl -sf --config "$cfg" -X DELETE "$api/releases/$rid/assets/$aid" >/dev/null
            done
            curl -sf --config "$cfg" -X POST -F "attachment=@$f" "$api/releases/$rid/assets?name=$name" >/dev/null
            echo "attached $name"
          done

  # One job builds all binaries and assembles every component image from them
  # (amd64 only). Single-job on purpose: artifact passing between jobs is not
  # available on this instance (runner zone cannot reach the public vhost).
  #
  # Runs inside rust:1.98-bookworm so the binaries link against the SAME glibc
  # (2.36) as the debian:bookworm-slim runtime base — building on the act
  # ubuntu-24.04 image (glibc 2.39) produces binaries that can fail to load in
  # the runtime image. This also pins rustc to the cluster-wide 1.98. No node
  # inside the container -> no JS actions in this job (manual clone, curl API
  # for the release asset). The apt-installed-buildah variant is an accepted
  # divergence from the fleet template (myserver#33): binaries are built
  # in-job and the image only COPYs, so layer caching buys nothing.
  #
  # `needs: release` only because the tarball attach at the end requires the
  # release object (created by the release job's upload) to exist.
  images:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: rust:1.98-bookworm
    env:
      REGISTRY: 10.10.0.30:3000
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
    steps:
      - name: Clone release tag
        # no checkout action in this job -> resolve the tag inline
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          # The token goes in a 0600 credential file, not in the URL (#1095):
          # a URL-embedded credential is echoed by git in its own error
          # messages and lands in .git/config.
          printf 'http://forgejo:%s@10.10.0.30:3000\n' "$GITHUB_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global credential.helper store
          git clone --depth 1 --branch "$tag" \
            "http://10.10.0.30:3000/${GITHUB_REPOSITORY}.git" src
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build deps + buildah
        run: |
          # The build's system packages come from the SAME list every CI job
          # uses (#1099). This job's own list had drifted from all five of
          # them: it carried libssl-dev and libpcap-dev, neither of which
          # anything in Cargo.lock binds, and it was MISSING libclang-dev,
          # which parallax genuinely needs (v4l2-sys-mit runs bindgen
          # unconditionally) and which these builds have been getting only
          # because rust:1.98-bookworm happens to carry libclang.
          cd src && scripts/ci-build-deps.sh
          # buildah and jq are this job's tooling, not build dependencies.
          apt-get install -y buildah jq
      # IS THIS THE NEWEST RELEASE? (#1095)
      #
      # The workflow_dispatch input is "existing bare-semver tag to
      # re-release", and nothing checked it was the newest — so re-releasing
      # 0.11.0 after 0.13.0 silently rolled all 21 images' `:latest` back, for
      # every quadlet in packaging/, all of which pull `:latest`.
      #
      # The tag list comes from the API, NOT from the checkout: this job clones
      # `--depth 1 --branch <tag>`, which fetches that tag and no other, so a
      # local `git tag` would always report the release as the newest thing
      # that exists and answer "yes" every time.
      #
      # AND IT FAILS CLOSED. If the tag list cannot be read, `:latest` is left
      # alone: leaving it stale is recoverable by the next release, moving it
      # backwards is what this exists to prevent.
      - name: Decide whether :latest moves
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"

          tags=$(curl -sf --config "$cfg" "$api/tags?limit=200" \
                 | jq -r '.[].name' \
                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$tags" ]; then
            echo "PUSH_LATEST=0" >> "$GITHUB_ENV"
            echo "::warning::could not read the repository's tag list; leaving :latest untouched rather than guessing"
            exit 0
          fi
          newest=$(printf '%s\n' "$tags" | sort -V | tail -1)
          echo "newest semver tag: $newest; releasing: $RELEASE_TAG"
          if [ "$newest" = "$RELEASE_TAG" ]; then
            echo "PUSH_LATEST=1" >> "$GITHUB_ENV"
          else
            echo "PUSH_LATEST=0" >> "$GITHUB_ENV"
            echo "::warning::$RELEASE_TAG is not the newest release ($newest) — :latest will NOT be moved"
          fi
      - name: Build release binaries
        run: |
          cd src
          pkgs=""
          for s in logs sysinfo snmp gnmi modbus netflow netlink netring systemd hostspec pve bmc container probe parallax; do
            pkgs="$pkgs -p zensight-sensor-$s"
          done
          pkgs="$pkgs -p zensight-exporter-prometheus -p zensight-exporter-otel -p zensight-correlator -p zensight-historian -p zensight-desired"
          cargo build --release --locked $pkgs
      - name: Stage binaries for Dockerfiles
        run: |
          cd src
          mkdir -p docker-bins/docker-binaries-amd64
          for s in logs sysinfo snmp gnmi modbus netflow netlink netring systemd hostspec pve bmc container probe parallax; do
            cp "target/release/zensight-sensor-$s" docker-bins/docker-binaries-amd64/
          done
          cp target/release/zensight-exporter-prometheus target/release/zensight-exporter-otel \
             target/release/zensight-correlator target/release/zensight-historian target/release/zensight-desired \
             docker-bins/docker-binaries-amd64/
      - name: Assemble linux-amd64 tarball
        run: |
          cd src
          name="zensight-${RELEASE_TAG}-linux-amd64"
          mkdir -p dist/release "stage/$name/configs"
          cp docker-bins/docker-binaries-amd64/* "stage/$name/"
          cp -r packaging/systemd "stage/$name/systemd"
          cp configs/*.json5 "stage/$name/configs/"
          (cd "stage/$name" && sha256sum zensight-* > SHA256SUMS)
          tar -C stage -czf "dist/release/$name.tar.gz" "$name"
      - name: Build component images and smoke-test
        run: |
          cd src
          # revision label from the clone's HEAD: GITHUB_SHA is the branch
          # head on a workflow_dispatch re-run, not the tag commit
          revision="$(git rev-parse HEAD)"
          labels="--label org.opencontainers.image.source=https://git.marcpardo.eu/${GITHUB_REPOSITORY} --label org.opencontainers.image.revision=${revision}"
          for c in zensight-sensor-logs zensight-sensor-sysinfo zensight-sensor-snmp \
                   zensight-sensor-gnmi zensight-sensor-modbus zensight-sensor-netflow \
                   zensight-sensor-netlink zensight-sensor-netring zensight-sensor-systemd \
                   zensight-sensor-hostspec \
                   zensight-sensor-pve \
                   zensight-sensor-bmc \
                   zensight-sensor-container \
                   zensight-sensor-probe \
                   zensight-sensor-parallax \
                   zensight-exporter-prometheus zensight-exporter-otel zensight-correlator \
                   zensight-historian \
                   zensight-desired; do
            image="$REGISTRY/marcpardo/$c"
            buildah --storage-driver vfs build $labels \
              --build-arg "BINARY_PACKAGE=$c" --build-arg TARGETARCH=amd64 \
              -t "$image:${RELEASE_TAG}" -t "$image:latest" -f docker/Dockerfile.runtime .
          done
          image="$REGISTRY/marcpardo/zensight-sensors"
          buildah --storage-driver vfs build $labels --build-arg TARGETARCH=amd64 \
            -t "$image:${RELEASE_TAG}" -t "$image:latest" -f docker/Dockerfile.sensors-runtime .
          # smoke, part 1: run one binary inside a runtime base — catches glibc
          # or shared-library skew at build time instead of on the fleet. The
          # correlator image has no entrypoint script to drive, so this is all
          # it gets.
          ctr=$(buildah --storage-driver vfs from "$REGISTRY/marcpardo/zensight-correlator:${RELEASE_TAG}")
          buildah --storage-driver vfs run "$ctr" -- /usr/local/bin/zensight-correlator --help >/dev/null
          buildah --storage-driver vfs rm "$ctr"
          # The historian too: it links redb, which the correlator does not, so
          # a linker skew in the store crate would otherwise reach the fleet
          # before anything here noticed.
          ctr=$(buildah --storage-driver vfs from "$REGISTRY/marcpardo/zensight-historian:${RELEASE_TAG}")
          buildah --storage-driver vfs run "$ctr" -- /usr/local/bin/zensight-historian --help >/dev/null
          buildah --storage-driver vfs rm "$ctr"
          ctr=$(buildah --storage-driver vfs from "$REGISTRY/marcpardo/zensight-desired:${RELEASE_TAG}")
          buildah --storage-driver vfs run "$ctr" -- /usr/local/bin/zensight-desired --help >/dev/null
          buildah --storage-driver vfs rm "$ctr"

          # smoke, part 2: START the sensors image, do not just ask it for help
          # (#472).
          #
          # `--help` exits before a config is read. It proves the binary loads,
          # which is worth having, and nothing else: every way an image can be
          # broken that is not a linker problem passes it. The image published
          # at 0.10.1 shipped five sensors whose registry advertised artifact
          # procedures they did not serve (#648) — a release build warns and
          # keeps going rather than dying, so `--help` was green while
          # `introspect` lied to the fleet for three weeks.
          #
          # So: run the real entrypoint — interface detection, config
          # generation, all six binaries, the shared spawner — for 25s
          # against an endpoint with nothing behind it.
          # Sensors are Zenoh peers and retry an unreachable endpoint in the
          # background, so no router is needed here (verified).
          #
          # Healthy means `timeout` had to kill it (124) AND the supervisor
          # logged no child exit. Missing privileges and missing host services are NOT
          # failures and must not be: netring without CAP_NET_RAW reports the
          # privilege and keeps running, and the systemd sensor without a
          # system bus answers `error/systemd/no-system-bus` — both are #648's
          # rule working, and both are the normal state inside this step.
          ctr=$(buildah --storage-driver vfs from "$REGISTRY/marcpardo/zensight-sensors:${RELEASE_TAG}")
          buildah --storage-driver vfs run "$ctr" -- bash -c '
            ZENSIGHT_ZENOH_CONNECT=tcp/127.0.0.1:17447 \
              timeout -s TERM 25 /usr/local/bin/entrypoint-sensors.sh >/tmp/smoke.log 2>&1
            rc=$?
            if [ "$rc" != 124 ]; then
              echo "::error::sensors image: the spawner exited on its own (rc=$rc)"
              tail -n 80 /tmp/smoke.log
              exit 1
            fi
            # The "a sensor died" arm. It used to be the rc check above, on the
            # theory that FAIL_FAST=1 made the spawner exit with the first
            # dead child — but #813 removed FAIL_FAST: the spawner now
            # supervises each child with 2,4,8,16,32 s of backoff before
            # giving up on it, which is 62 s of sleeping inside a 25 s window.
            # rc was therefore always 124, and a sensor that exited at startup
            # (a bad generated config, exit 64, a missing file) passed the
            # gate for as long as that lasted. The supervisor logs every exit
            # it sees; that line is the signal.
            if grep -qE "run-sensors: .* exited \(rc=" /tmp/smoke.log; then
              echo "::error::sensors image: a sensor exited at startup and was restarted by the supervisor"
              grep -nE "run-sensors: .* exited \(rc=" /tmp/smoke.log
              exit 1
            fi
            if grep -q "panicked at" /tmp/smoke.log; then
              echo "::error::sensors image: a sensor panicked at startup"
              grep -n -B2 -A10 "panicked at" /tmp/smoke.log
              exit 1
            fi
            # The release-build form of the #484 registry check. In a debug
            # build this is a panic; here it is a warning, and a warning nobody
            # greps for is how #648 shipped.
            if grep -q "does not serve" /tmp/smoke.log; then
              echo "::error::sensors image: a producer advertises procedures it does not serve — introspect would ship that to the fleet as truth (RFC 08 6.1, #648)"
              grep -n "does not serve" /tmp/smoke.log
              exit 1
            fi
            echo "sensors image: six sensors alive after 25s, no panics, registry honest"
          '
          buildah --storage-driver vfs rm "$ctr"
          # The exporter images were built and PUSHED without ever being
          # executed (#776). Same one-binary smoke as above, so a glibc or
          # shared-library skew in those two images is caught here rather than
          # by whoever pulls them.
          for c in zensight-exporter-prometheus zensight-exporter-otel; do
            ctr=$(buildah --storage-driver vfs from "$REGISTRY/marcpardo/$c:${RELEASE_TAG}")
            buildah --storage-driver vfs run "$ctr" -- "/usr/local/bin/$c" --help >/dev/null
            buildah --storage-driver vfs rm "$ctr"
          done

          # smoke, part 4: START parallax (#512). It gets more than `--help`
          # for a specific reason: it is the ONLY binary here that is not pure
          # Rust. openh264 is compiled from C++ source, so parallax is the one
          # component that links `libstdc++.so.6` — a class of image breakage
          # no other component can have and `--help` would only half catch.
          #
          # It can be started with no hardware at all: the shipped config's
          # default source is a synthetic test pattern, which rides the same
          # catalogue/encode/egress path a real camera does. Healthy means
          # `timeout` had to kill it (124), exactly as for the sensors bundle.
          ctr=$(buildah --storage-driver vfs from "$REGISTRY/marcpardo/zensight-sensor-parallax:${RELEASE_TAG}")
          buildah --storage-driver vfs run "$ctr" -- sh -c '
            cat > /tmp/parallax.json5 <<EOF
          { zenoh: { mode: "peer", connect: ["tcp/127.0.0.1:17447"] },
            parallax: { source: "smoke", enumerate_v4l2: false,
                        test_sources: [ { name: "test0", pattern: "smpte",
                                          width: 320, height: 180, fps: 5 } ] } }
          EOF
            timeout -s TERM 20 /usr/local/bin/zensight-sensor-parallax \
              --config /tmp/parallax.json5 >/tmp/parallax.log 2>&1
            rc=$?
            if [ "$rc" != 124 ]; then
              echo "::error::parallax image: the sensor exited on its own (rc=$rc)"
              tail -n 80 /tmp/parallax.log
              exit 1
            fi
            if grep -q "panicked at" /tmp/parallax.log; then
              echo "::error::parallax image: the sensor panicked at startup"
              grep -n -B2 -A10 "panicked at" /tmp/parallax.log
              exit 1
            fi
            if grep -q "does not serve" /tmp/parallax.log; then
              echo "::error::parallax image: the producer advertises procedures it does not serve (RFC 08 6.1, #648)"
              grep -n "does not serve" /tmp/parallax.log
              exit 1
            fi
            echo "parallax image: alive after 20s on a test pattern, no panics, registry honest"
          '
          buildah --storage-driver vfs rm "$ctr"
      - name: Push images
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # --password-stdin (#1095): with -p the registry token is an argv
          # element, visible to anything that can read the runner's process
          # table for as long as the login takes.
          printf '%s' "$REGISTRY_TOKEN" \
            | buildah --storage-driver vfs login --tls-verify=false \
                -u marcpardo --password-stdin "$REGISTRY"
          for c in zensight-sensor-logs zensight-sensor-sysinfo zensight-sensor-snmp \
                   zensight-sensor-gnmi zensight-sensor-modbus zensight-sensor-netflow \
                   zensight-sensor-netlink zensight-sensor-netring zensight-sensor-systemd \
                   zensight-sensor-hostspec \
                   zensight-sensor-pve \
                   zensight-sensor-bmc \
                   zensight-sensor-container \
                   zensight-sensor-probe \
                   zensight-sensor-parallax \
                   zensight-exporter-prometheus zensight-exporter-otel zensight-correlator \
                   zensight-historian \
                   zensight-desired \
                   zensight-sensors; do
            image="$REGISTRY/marcpardo/$c"
            buildah --storage-driver vfs push --tls-verify=false "$image:${RELEASE_TAG}"
            # :latest ONLY WHEN THIS IS THE NEWEST RELEASE (#1095). The
            # workflow_dispatch input is "existing bare-semver tag to
            # re-release" and nothing checked it was the newest, so
            # re-releasing 0.11.0 after 0.13.0 silently rolled all 21 images'
            # :latest back — for every quadlet in packaging/, all of which pull
            # :latest.
            if [ "${PUSH_LATEST:-1}" = "1" ]; then
              buildah --storage-driver vfs push --tls-verify=false "$image:latest"
            fi
          done
          if [ "${PUSH_LATEST:-1}" != "1" ]; then
            echo "::warning::${RELEASE_TAG} is not the newest release — pushed 21 :${RELEASE_TAG} tags and left :latest where it was"
          fi
      - name: Attach tarball to the release
        run: |
          cd src
          name="zensight-${RELEASE_TAG}-linux-amd64"
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          # 0600 curl config rather than -H "$auth" (#1095): the header is
          # an argv element at every call site otherwise.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "${GITHUB_TOKEN}" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          rid=$(curl -sf --config "$cfg" "$api/releases/tags/${RELEASE_TAG}" | jq .id)
          f="$name.tar.gz"
          # idempotent on re-runs: drop a stale same-name asset first
          aid=$(curl -sf --config "$cfg" "$api/releases/$rid/assets" | jq ".[] | select(.name==\"$f\") | .id" | head -1)
          [ -n "$aid" ] && curl -sf --config "$cfg" -X DELETE "$api/releases/$rid/assets/$aid" || true
          curl -sf --config "$cfg" -F "attachment=@dist/release/$f" \
            "$api/releases/$rid/assets?name=$f" >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    # needs: release for ordering, not artifacts — forgejo-release's
    # override recreates the release object, and anything attached before
    # that is silently wiped (lost the 0.9.0 bundle that way).
    needs: release
    runs-on: flatpak
    timeout-minutes: 120
    env:
      # SDK/runtime installs persist on the runner cache disk
      FLATPAK_USER_DIR: /srv/cache/flatpak/inst
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
      - name: Build flatpak (unsigned; vm-edge signs on publish)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # per-repo state dir on the cache disk: incremental module rebuilds
          # + ccache for C/C++ inside the sandbox. flatpak-builder requires
          # state dir and build tree on the same filesystem -> stage the
          # build on the cache disk and copy the bundle back.
          work=/srv/cache/flatpak/zensight/work
          mkdir -p "$work" && rm -rf "$work/src" && cp -a . "$work/src"
          cd "$work/src"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --state-dir=/srv/cache/flatpak/zensight/state --ccache \
            --install-deps-from=flathub \
            --repo=export-repo builddir flatpak/com.github.p13marc.ZenSight.yml
          mkdir -p "$GITHUB_WORKSPACE/dist/release"
          flatpak build-bundle export-repo \
            "$GITHUB_WORKSPACE/dist/release/zensight-${RELEASE_TAG}.flatpak" com.github.p13marc.ZenSight
      - name: Publish export branch for vm-edge
        run: |
          cd /srv/cache/flatpak/zensight/work/src/export-repo
          git init -q -b flatpak-export
          git add -A
          git -c user.name=ci -c user.email=ci@marcpardo.eu commit -q -m "flatpak export ${RELEASE_TAG}"
          # Credential file, not a URL (#1095): the raw expression above used
          # to be interpolated into the rendered script text AND written into
          # this repo's .git/config.
          printf 'http://forgejo:%s@10.10.0.30:3000\n' "$GITHUB_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global credential.helper store
          git push --force "http://10.10.0.30:3000/${GITHUB_REPOSITORY}.git" HEAD:flatpak-export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # curl attach, not forgejo-release: by this point the release job has
      # already created the release object, and a second forgejo-release
      # upload against the same tag 409s (seen on the 0.9.0 maiden run).
      - name: Attach flatpak bundle to the release
        run: |
          f="zensight-${RELEASE_TAG}.flatpak"
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          # 0600 curl config rather than -H "$auth" (#1095): the header is
          # an argv element at every call site otherwise.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "${GITHUB_TOKEN}" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          rid=$(curl -sf --config "$cfg" "$api/releases/tags/${RELEASE_TAG}" | jq .id)
          aid=$(curl -sf --config "$cfg" "$api/releases/$rid/assets" | jq ".[] | select(.name==\"$f\") | .id" | head -1)
          [ -n "$aid" ] && curl -sf --config "$cfg" -X DELETE "$api/releases/$rid/assets/$aid" || true
          curl -sf --config "$cfg" -F "attachment=@dist/release/$f" \
            "$api/releases/$rid/assets?name=$f" >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One SHA256SUMS covering every asset, uploaded exactly once (fleet
  # standard, myserver#29). The assets are produced by three different jobs
  # and artifact passing is unavailable on this instance, so the last job
  # downloads what the release actually holds and hashes that — the sums are
  # of the published bytes, not of what a job thinks it uploaded.
  checksums:
    needs: [images, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Publish SHA256SUMS over all release assets
        run: |
          set -eu
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          tag="${{ inputs.tag || github.ref_name }}"
          api="http://10.10.0.30:3000/api/v1/repos/${GITHUB_REPOSITORY}"
          # 0600 curl config rather than -H "$auth" (#1095): the header is
          # an argv element at every call site otherwise.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "${GITHUB_TOKEN}" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          rid=$(curl -sf --config "$cfg" "$api/releases/tags/$tag" | jq .id)
          mkdir -p sums && cd sums
          curl -sf --config "$cfg" "$api/releases/$rid/assets" > .assets.json
          # every asset except a stale SHA256SUMS itself (dispatch re-run)
          jq -r '.[] | select(.name != "SHA256SUMS") | "\(.uuid) \(.name)"' .assets.json \
            | while read -r uuid name; do
                curl -sf --config "$cfg" -o "$name" "http://10.10.0.30:3000/attachments/$uuid"
              done
          sha256sum * > SHA256SUMS
          # idempotent on re-runs: drop the stale SHA256SUMS first
          aid=$(jq '.[] | select(.name=="SHA256SUMS") | .id' .assets.json | head -1)
          [ -n "$aid" ] && curl -sf --config "$cfg" -X DELETE "$api/releases/$rid/assets/$aid" || true
          curl -sf --config "$cfg" -F "attachment=@SHA256SUMS" \
            "$api/releases/$rid/assets?name=SHA256SUMS" >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
