name: CI
on:
  push:
    branches: [main, master]
    # run the full suite on release tags too — otherwise tagging executes
    # zero tests (release.yml only builds). Parallel signal, not a gate.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  # manual re-run path (flaky job, runner was offline, cache experiments)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97 branch head; SHA-pinned (#845) — with a SHA the toolchain must be named explicitly
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-targets: false
      - run: cargo test --workspace --locked
      # zensight-common ALONE (#845): the workspace build unifies features, so
      # `zensight`'s default `validate` turns `validate-json` on for the whole
      # graph and the feature-OFF tests — the #791 "FeatureOff renders as not
      # checked, never as a pass" contract — never compile above. Built alone,
      # the crate gets its real default feature set (empty) and they run.
      - run: cargo test -p zensight-common --locked

  # Nothing in CI had ever EXECUTED an exporter.
  #
  # release.yml builds and pushes twelve component images, both exporters
  # included, and smoke-runs `--help` on exactly two of them (sysinfo,
  # correlator). And while `cargo test --workspace` covers the exporters' unit
  # tests, nothing anywhere started a hub, a sensor and an exporter and scraped
  # /metrics. That gap is how two scrape-killers shipped: a `# TYPE ... info`
  # token that made Prometheus discard every sample in the body (#752), and a
  # duplicate `device` label that made it reject the sample outright (#753).
  # Both were invisible to the whole suite, which only ever asserted substrings
  # of a body it never validated.
  #
  # This closes it: one real sensor, BOTH real exporters (a Prometheus scrape,
  # and — #845 — an OTLP/HTTP export into a local sink; the otel exporter had
  # never been executed by anything), on isolated ports with no containers
  # and no privileges.
  demo-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97 branch head; SHA-pinned (#845) — with a SHA the toolchain must be named explicitly
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-targets: false
      # Debug profile: this asserts behaviour, not speed, and a release build of
      # the sensor costs minutes for no extra signal.
      - run: PROFILE=debug scripts/demo-verify.sh

  # Nothing in CI had ever asked a running FLEET whether it obeys its own
  # contract.
  #
  # `cargo test --workspace` proves the code agrees with itself, and
  # demo-smoke proves the exporter path carries data. Neither can say whether
  # what a running sensor PUTS ON THE WIRE agrees with the keyspace-v2 RFCs and
  # with the registry TOMLs that same binary serves on `@rpc/…/introspect`:
  # the served-vs-declared slice diff, `alive => callable` (RFC 04 §5), schema
  # drift, declared-vs-observed QoS, freshness against declared ttl_s,
  # cardinality budgets. Those are properties of a deployment, and only a
  # deployment can be asked.
  #
  # This asks: one real sensor, the real registry, the real judges
  # (zenkey-fleet's `run_doctor` — the same entry point `zenctl doctor` calls),
  # on an isolated port with no containers and no privileges.
  #
  # What it gates on is documented in zensight-conformance/README.md. Nothing
  # is excluded by default any more: the one historical exclusion (`field-new`,
  # upstream zenkey#384) lifted with zenkey-fleet 0.11.1 and #845 removed it —
  # after it had sat stale for a release, which is why the README now requires
  # any future exclusion to carry a re-check for its own lift-condition.
  #
  # Debug profile and a 12s listen window (now --strict-window, #845: a window
  # that shed samples is unobservable, not quietly clean): this asserts
  # behaviour, not speed, and the runner has two build lanes.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97 branch head; SHA-pinned (#845) — with a SHA the toolchain must be named explicitly
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: conformance
          cache-targets: false
      - run: PROFILE=debug scripts/conformance-verify.sh

  # Optional features gate real code that a default build never type-checks:
  # `#[cfg(feature = ...)]` blocks in `main.rs`/`query.rs` and, in netring's
  # case, whole detector modules. #485 shipped `h264` broken for a week under
  # exactly this blind spot — `app.rs` passed a `RemoteOrigin` into a `String`
  # parameter and nobody found out until someone built it (#649). This job is
  # the general form of that fix (#662).
  #
  # One job, one step per feature, not a matrix: the steps share a target dir,
  # so netring's six detectors cost one build plus five deltas instead of six
  # cold ones. A named step per feature means the CI log says *which* feature
  # stopped compiling, which `--all-features` cannot. (netring's sets are in
  # fact additive — `--all-features` builds — but a per-feature check also
  # catches "feature A alone no longer compiles because it leans on something
  # only B pulls in", which is the more likely regression.)
  #
  # NOT covered here: `zensight-sensor-{netlink,sysinfo}` `--features ebpf`.
  #
  # Note what `sysinfo --features nvml` can and cannot be: no build machine has
  # an NVIDIA card, so that leg type-checks a path nothing executes. It is
  # deliberately the only claim made for it (#954).
  # Their build scripts invoke `aya-build` through `rustup run nightly`, so the
  # leg needs a nightly toolchain, `rust-src`, and a `bpf-linker` install (a
  # 100 MB prebuilt binary with LLVM baked in — building it from source needs a
  # matching system LLVM the runner image has not got, #674) on top of
  # everything above — too much for every push. Both were
  # verified to compile by hand at the commit that added this job; see #662 for
  # the standing plan to cover them out-of-band.
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97 branch head; SHA-pinned (#845) — with a SHA the toolchain must be named explicitly
        with:
          toolchain: "1.97"
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: features
          cache-targets: false

      # Every step here is `cargo clippy -- -D warnings`, not `cargo check`
      # (#845): check exits 0 on warnings while every other job denies them,
      # so feature-gated code was the one place a warning — or any clippy
      # lint — could land silently. Same build cost, strictly more signal.

      # zensight: default features OFF (#791). `validate` is default-ON, so a
      # workspace build never type-checks the FeatureOff path — the exact
      # blind spot this job exists for, in the other direction: the build
      # where verdicts must degrade to "not checked" rather than vanish.
      - name: zensight --no-default-features
        run: cargo clippy -p zensight --no-default-features --all-targets --locked -- -D warnings
      # zensight: the F12 UI recorder.
      - name: zensight --features tester
        run: cargo clippy -p zensight --features tester --all-targets --locked -- -D warnings
      # zensight: the opt-in H.264 live view. The expensive one — it pulls
      # openh264, a C++ build from source. This is the #649 step, moved here.
      - name: zensight --features h264
        run: cargo clippy -p zensight --features h264 --all-targets --locked -- -D warnings

      # Crates whose DEFAULT features hide a real alternate build (#845):
      # logs without journald is the documented "platforms without libsystemd"
      # build; zensight-btf without std is the no_std path the eBPF crates
      # depend on. Neither had a leg, so both could rot invisibly.
      - name: logs --no-default-features
        run: cargo clippy -p zensight-sensor-logs --no-default-features --all-targets --locked -- -D warnings
      # Lib only, deliberately no --all-targets: the no_std claim is the
      # LIBRARY's; the crate's tests and examples require std and always will.
      - name: btf --no-default-features
        run: cargo clippy -p zensight-btf --no-default-features --locked -- -D warnings

      # probe's icmp check needs a raw socket, so it is a build feature and a
      # default build never type-checks it. Added with #984 — it had been
      # feature-gated since the sensor shipped with no leg here, which is the
      # blind spot this whole job exists for.
      - name: probe --features icmp
        run: cargo clippy -p zensight-sensor-probe --features icmp --all-targets --locked -- -D warnings

      # sysinfo's NVML path (#954). There is NO NVIDIA hardware on any build
      # machine, so this leg is the ONLY thing that checks it: nothing
      # executes it, here or anywhere. That is the deal the feature was
      # accepted on, and this step is the half of it CI can keep.
      #
      # It also proves the conditional ledger's condition is real: with the
      # feature on, `conditional.lock`'s four sysinfo entries stop being
      # excuses and the families must actually be emitted, so the coverage
      # check fails if the gate ever stops being what makes the difference.
      - name: sysinfo --features nvml
        run: cargo clippy -p zensight-sensor-sysinfo --features nvml --all-targets --locked -- -D warnings
      - name: sysinfo --features nvml (tests)
        run: cargo test -p zensight-sensor-sysinfo --features nvml --locked

      # netring detectors, each off by default and each pulling its own
      # upstream parser through the netring facade.
      - name: netring --features sigma
        run: cargo clippy -p zensight-sensor-netring --features sigma --all-targets --locked -- -D warnings
      - name: netring --features yara
        run: cargo clippy -p zensight-sensor-netring --features yara --all-targets --locked -- -D warnings
      - name: netring --features snmp
        run: cargo clippy -p zensight-sensor-netring --features snmp --all-targets --locked -- -D warnings
      - name: netring --features lateral
        run: cargo clippy -p zensight-sensor-netring --features lateral --all-targets --locked -- -D warnings
      - name: netring --features ipfix
        run: cargo clippy -p zensight-sensor-netring --features ipfix --all-targets --locked -- -D warnings
      # ja4plus carries the FoxIO License 1.1, which is NOT OSI. Compiling it in
      # its own opt-in step keeps it type-checked without putting it anywhere
      # near the default path — the default build stays OSI-clean.
      - name: netring --features ja4plus
        run: cargo clippy -p zensight-sensor-netring --features ja4plus --all-targets --locked -- -D warnings

  # cargo-deny is the fleet's single supply-chain lint (myserver#33):
  # advisories, licenses, bans, sources — config in deny.toml.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97 branch head; SHA-pinned (#845) — with a SHA the toolchain must be named explicitly
        with:
          toolchain: "1.97"
      # the docker cargo-deny action cannot see deny.toml -> install directly
      - uses: https://github.com/taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny
      # The advisory-db clone persists in the runner lane's cargo home, and a
      # clone corrupted mid-fetch ("expected flush after ref listing") fails
      # every later run ON THAT LANE as `advisories FAILED` — intermittent by
      # lane, and without job logs indistinguishable from a real advisory.
      #
      # TRY, THEN RESET AND RETRY ONCE. Two earlier shapes were both wrong:
      #
      #   1. `rm -rf ~/.cargo/advisory-dbs` before every run. cargo-deny moved
      #      its cache directory under it — 0.18 and earlier used the plural,
      #      0.20 uses `advisory-db` — and install-action installs the latest,
      #      so the step was deleting a directory nothing writes to and the
      #      wedge it existed to clear survived.
      #
      #   2. `rm -rf` BOTH before every run. That cleared the wedge, and made
      #      every run re-clone the whole advisory database from github.com,
      #      so a single network flake became a red merge gate. It failed on
      #      three of the four runs after it landed while `cargo deny check`
      #      was clean locally at those exact commits — the cache had been the
      #      thing absorbing that, and removing it unconditionally removed the
      #      resilience along with the staleness.
      #
      # So: use the cache, and reset it only when something actually went
      # wrong. A wedged clone heals on the retry, a flaked fetch gets a second
      # chance, and a REAL advisory fails both attempts and still gates.
      - name: cargo deny (reset the advisory-db cache and retry on failure)
        run: |
          cargo deny --version
          if cargo deny check; then exit 0; fi
          echo "::warning::cargo deny failed; resetting the advisory-db cache and retrying once"
          rm -rf ~/.cargo/advisory-db ~/.cargo/advisory-dbs "${CARGO_HOME:-$HOME/.cargo}/advisory-db" "${CARGO_HOME:-$HOME/.cargo}/advisory-dbs"
          cargo deny check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97 branch head; SHA-pinned (#845) — with a SHA the toolchain must be named explicitly
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: lint
          cache-targets: false

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Shared guard plumbing (#845): ONE computed source list — every crate's
      # src/, so a new crate is covered the day it is added instead of when
      # someone remembers to extend five hand-kept lists (they had drifted:
      # the queryable and state-seed guards missed zensight/, the exporters
      # and rerun entirely) — and ONE test-stripping awk that suppresses a
      # #[cfg(test)]-gated item to its brace-balanced end instead of to end
      # of file (the old sentinel never reset, so any file with an inline
      # test module went blind for the rest of the file — ~580 production
      # lines of zensight-common/src/config.rs included).
      - name: prepare guard helpers
        run: |
          ls -d zensight*/src | sort > /tmp/guard-src-all
          # EXCLUDE (named, with the reason — the session guard only):
          #   zensight-conformance/src opens deliberately un-namespaced
          #   observer sessions via zenkey_fleet::open (RFC 09 §5): it judges
          #   the wire as it really is and must not ride the production seam.
          #   Every other guard still covers it.
          grep -v '^zensight-conformance/src$' /tmp/guard-src-all > /tmp/guard-src-sessions
          cat > /tmp/strip_tests.awk <<'AWK'
          FNR == 1 { intest = 0 }
          /^#\[cfg\(test\)\]/ { intest = 1; depth = 0; opened = 0; next }
          intest {
            for (i = 1; i <= length($0); i++) {
              c = substr($0, i, 1)
              if (c == "{") { depth++; opened = 1 } else if (c == "}") depth--
            }
            if (opened && depth <= 0) intest = 0
            else if (!opened && $0 ~ /;[[:space:]]*$/) intest = 0
            next
          }
          { print FILENAME ":" FNR ":" $0 }
          AWK
          # every *.rs under the list, test-stripped, ready to grep
          strip() { find $(cat "$1") -name '*.rs' -print0 | xargs -0 awk -f /tmp/strip_tests.awk; }
          strip /tmp/guard-src-all      > /tmp/guard-stripped-all
          strip /tmp/guard-src-sessions > /tmp/guard-stripped-sessions

      # D2 (#28): all colors must come from the design-system modules. Widened
      # in #845: the old pattern matched only `Color::from_rgb*`, so the
      # associated constants (`Color::BLACK` — one was live in chart.rs), the
      # struct literal and the `color!` macro all walked past it. The literal
      # arm matches a literal whatever field leads — it used to require `r`,
      # so `Color { a: .., ..base }` walked past it too (two were live in
      # chart.rs; they use `tokens::with_alpha` now).
      - name: no ad-hoc colors (D2 guard)
        run: |
          hits=$(grep -rnE "Color::(from_rgb|new|BLACK|WHITE|TRANSPARENT)\b|iced::color!|Color *\{ *[rgba] *:" zensight/src --include='*.rs' \
            | grep -vE "view/theme\.rs|view/tokens\.rs|view/components/" || true)
          if [ -n "$hits" ]; then
            echo "::error::Ad-hoc Color::from_rgb outside the design-system modules:"
            echo "$hits"
            exit 1
          fi

      # R5 (#356): every publication must go through a declared publisher.
      - name: declared-publishers only (R5 guard)
        run: |
          hits=$(grep -E '(session[a-z_]*|zenoh)\.(put|delete)\(' /tmp/guard-stripped-all \
            | grep -vE 'publisher_registry\.rs' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw session.put/delete — publish through a declared publisher (PublisherRegistry / AdvancedPublisherRegistry / declare_publisher):"
            echo "$hits"
            exit 1
          fi

      # #484: every queryable goes through zensight_common::served, so the
      # registry-vs-served check knows what this build actually serves.
      - name: The exporters must not hand-roll a plain telemetry subscriber
        run: |
          # Sensors publish telemetry through an AdvancedPublisher, and the GUI
          # has always consumed with history + recovery. Both exporters used a
          # plain `declare_subscriber`, so one started after the sensors got no
          # backfill and a sample dropped in flight was simply lost (#763).
          #
          # The alert, liveliness and events subscribers are deliberately plain:
          # they carry LWW state or append-only records, not a recoverable
          # stream, so they are matched out by name below.
          hits=$(grep -rn '\.declare_subscriber(' \
            zensight-exporter-*/src \
            --include='*.rs' \
            | grep -vE 'alerts_key|alive_key|events_key|/tests/|mod tests' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw declare_subscriber in an exporter — use zensight_common::subscribe::declare_telemetry_subscriber so history/recovery cannot silently regress (#763):"
            echo "$hits"
            exit 1
          fi

      - name: queryables are declared through served::serve_queryable (#484)
        run: |
          hits=$(grep -n '\.declare_queryable(' /tmp/guard-stripped-all \
            | grep -vE 'served\.rs' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw declare_queryable — serve through zensight_common::served::serve_queryable so registry coverage (RFC 08 §6.1, #484) can see it:"
            echo "$hits"
            exit 1
          fi

      # RFC 07 §1.2 (#715): the report path cannot reach an encoder.
      - name: receiver feedback informs, it does not command (RFC 07 §1.2)
        run: |
          # §1.2 is normative and NEGATIVE: a producer MUST NOT re-tune a
          # shared tier from one consumer's report. Two viewers share a tier,
          # one reports loss, the bitrate drops, and the healthy viewer's
          # picture degrades for a reason it cannot see, caused by a peer it
          # does not know exists.
          #
          # A negative has no natural unit test — you cannot assert that a
          # function nobody wrote was not called. What you can assert is that
          # the module holding receiver feedback has no way to reach the knobs,
          # which is a property of its imports. src/reports.rs takes an
          # Arc<ReceiverReports> and nothing else, on purpose.
          #
          # zensight-sensor-parallax/tests/rfc07_receiver_driven.rs is the same
          # check; this step exists so a branch that never runs the parallax
          # suite still fails.
          hits=$(grep -nE 'PipelineControls|EncoderControl|ScaleControl|ThrottleControl|SessionHandle|SessionMsg|KeyframeHandle|request_keyframe|set_bitrate' \
            zensight-sensor-parallax/src/reports.rs \
            | grep -vE '^[0-9]+: *//' || true)   # the module doc names them to explain the rule
          if [ -n "$hits" ]; then
            echo "::error::src/reports.rs reaches an encoder control. RFC 07 §1.2 forbids re-tuning a shared tier from a consumer's report (#715). If a control path genuinely belongs there, §1.2 requires a STATED arbitration rule that is not 'the most recent report':"
            echo "$hits"
            exit 1
          fi

      # #782: a state-class seed's replies must be stamped.
      - name: state-class seeds are served through the stamping seam (#782)
        run: |
          # A queryable on a STATE selector answers RFC 04 §3.2's plain-GET
          # seed path storage-shaped, and a storage's samples are timestamped —
          # "an untimestamped sample cannot be reconciled". Zenoh's session HLC
          # stamps a `put` and does NOT stamp a queryable reply, so the seed
          # path needs `served::serve_state_queryable`, whose `StateQuery`
          # exposes no unstamped `reply()` at all.
          #
          # The real check is structural: `serve_queryable` debug-panics on a
          # state selector, so a producer's own test suite fails. This step is
          # the tripwire for the case that never runs a test — matched on the
          # key-builder names the two seed call sites actually use. A grep
          # cannot classify a key; it can only notice the shapes we know about.
          hits=$(grep -E 'serve_queryable\([^)]*(entities_query_key|state_key)' /tmp/guard-stripped-all \
            | grep -vE 'served\.rs' || true)
          if [ -n "$hits" ]; then
            echo "::error::A state-class queryable declared through the unstamped seam — use served::serve_state_queryable, whose replies carry the seed's HLC stamp (RFC 04 §3.2, #782):"
            echo "$hits"
            exit 1
          fi

      # #466: keys are base-relative; the deployment base is never spelled.
      - name: application code never spells the deployment base (#466)
        run: |
          hits=$(grep -E '"zensight/' /tmp/guard-stripped-all \
            | grep -vE 'journald\.cursor|zensight/host-id' \
            | grep -vE ':[0-9]+: *//' || true)
          if [ -n "$hits" ]; then
            echo "::error::A key literal spells the deployment base. Keys are base-relative (#466) — the session namespace adds 'zensight/'. Build them through zenkey/zensight-common:"
            echo "$hits"
            exit 1
          fi

      # #466: the session namespace is set in exactly one place.
      - name: every production session goes through zensight_common::session (#466, #789)
        run: |
          # This guard is SPELLING-BASED and the list must grow with every new
          # way to open a session (#789). It used to grep the single literal
          # `zenoh::open(`, which meant `zenkey_fleet::open()` and
          # `open_with_config()` — reachable since #745 put zenkey-fleet in the
          # GUI's dependency tree — walked straight past it. The pattern below
          # matches any lowercase-module `::open(` / `::open_*(`; `File::open`
          # and every other type-associated constructor is capitalised and does
          # not match.
          #
          # The rule is not stylistic. session.rs is where `namespace` is
          # applied and where `timestamping/enabled` is forced on, and the
          # comment there records what losing the latter costs: every peer-mode
          # sensor fails to create its cached publishers and the correlator
          # never receives evidence. A session opened elsewhere misses both.
          #
          # SRC deliberately does not reach tests/ or examples/ — an isolated
          # test session is exactly what a test should be allowed to build.
          #
          # The last filter is the ALLOWLIST, and it is the point of the whole
          # step: `session::{open_session,connect,build_config}` are the
          # sanctioned entry points, so calling one is the behaviour this guard
          # exists to produce, not a violation. Any other `::open(` in
          # application code is a new way to open a session and must be
          # justified here before it is added.
          # Two spellings are matched (#845): the call-site path form, and a
          # `use` that imports `open`/`open_*` (bare or braced, aliased or
          # not) — the import form made the call site a bare `open(...)`
          # that the first pattern could never see.
          hits=$(grep -E -e '\b[a-z][a-z0-9_]*::open(_[a-z0-9_]+)?\(' \
                        -e ':(pub )?use [^;]*::(open|open_[a-z0-9_]+)( as [a-z0-9_]+)? *;' \
                        -e ':(pub )?use [^;]*::\{[^}]*\b(open|open_[a-z0-9_]+)\b[^}]*\} *;' \
                        /tmp/guard-stripped-sessions \
            | grep -vE 'zensight-common/src/session.rs|zensight-rerun/src/session.rs' \
            | grep -vE ':[0-9]+: *//' \
            | grep -vE 'session::(open_session|connect|build_config)\(' || true)
          if [ -n "$hits" ]; then
            echo "::error::A session is opened outside zensight_common::session. Open via zensight_common::session::{connect,build_config} — it is the only place the deployment namespace (#466) and timestamping are set. If this is a false positive (a ::open() that is not a session), extend the allowlist in this step and say why:"
            echo "$hits"
            exit 1
          fi
