name: CI
on:
  push:
    branches: [main, master]
    # run the full suite on release tags too — otherwise tagging executes
    # zero tests (release.yml only builds). Parallel signal, not a gate.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@1.97
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo test --workspace --locked

  # Optional features gate real code that a default build never type-checks:
  # `#[cfg(feature = ...)]` blocks in `main.rs`/`query.rs` and, in netring's
  # case, whole detector modules. #485 shipped `h264` broken for a week under
  # exactly this blind spot — `app.rs` passed a `RemoteOrigin` into a `String`
  # parameter and nobody found out until someone built it (#649). This job is
  # the general form of that fix (#662).
  #
  # One job, one step per feature, not a matrix: the steps share a target dir,
  # so netring's six detectors cost one build plus five deltas instead of six
  # cold ones. A named step per feature means the CI log says *which* feature
  # stopped compiling, which `--all-features` cannot. (netring's sets are in
  # fact additive — `--all-features` builds — but a per-feature check also
  # catches "feature A alone no longer compiles because it leans on something
  # only B pulls in", which is the more likely regression.)
  #
  # NOT covered here: `zensight-sensor-{netlink,sysinfo}` `--features ebpf`.
  # Their build scripts invoke `aya-build` through `rustup run nightly`, so the
  # leg needs a nightly toolchain, `rust-src`, and a `bpf-linker` install (a
  # 100 MB prebuilt binary with LLVM baked in — building it from source needs a
  # matching system LLVM the runner image has not got, #674) on top of
  # everything above — too much for every push. Both were
  # verified to compile by hand at the commit that added this job; see #662 for
  # the standing plan to cover them out-of-band.
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@1.97
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: features
          cache-targets: false

      # zensight: the F12 UI recorder.
      - name: zensight --features tester
        run: cargo check -p zensight --features tester --locked
      # zensight: the opt-in H.264 live view. The expensive one — it pulls
      # openh264, a C++ build from source. This is the #649 step, moved here.
      - name: zensight --features h264
        run: cargo check -p zensight --features h264 --locked

      # netring detectors, each off by default and each pulling its own
      # upstream parser through the netring facade.
      - name: netring --features sigma
        run: cargo check -p zensight-sensor-netring --features sigma --locked
      - name: netring --features yara
        run: cargo check -p zensight-sensor-netring --features yara --locked
      - name: netring --features snmp
        run: cargo check -p zensight-sensor-netring --features snmp --locked
      - name: netring --features lateral
        run: cargo check -p zensight-sensor-netring --features lateral --locked
      - name: netring --features ipfix
        run: cargo check -p zensight-sensor-netring --features ipfix --locked
      # ja4plus carries the FoxIO License 1.1, which is NOT OSI. Compiling it in
      # its own opt-in step keeps it type-checked without putting it anywhere
      # near the default path — the default build stays OSI-clean.
      - name: netring --features ja4plus
        run: cargo check -p zensight-sensor-netring --features ja4plus --locked

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libsystemd-dev libclang-dev
      - uses: https://github.com/dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: lint
          cache-targets: false

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # D2 (#28): all colors must come from the design-system modules.
      - name: no ad-hoc colors (D2 guard)
        run: |
          hits=$(grep -rn "Color::from_rgb" zensight/src --include='*.rs' \
            | grep -vE "view/theme\.rs|view/tokens\.rs|view/components/" || true)
          if [ -n "$hits" ]; then
            echo "::error::Ad-hoc Color::from_rgb outside the design-system modules:"
            echo "$hits"
            exit 1
          fi

      # R5 (#356): every publication must go through a declared publisher.
      - name: declared-publishers only (R5 guard)
        run: |
          hits=$(grep -rnE '(session[a-z_]*|zenoh)\.(put|delete)\(' \
            zensight/src zensight-common/src zensight-correlator/src \
            zensight-sensor-core/src zensight-sensor-*/src zensight-exporter-*/src \
            zensight-rerun/src \
            --include='*.rs' \
            | grep -vE 'publisher_registry\.rs|/tests/|_test\.rs|mod tests' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw session.put/delete — publish through a declared publisher (PublisherRegistry / AdvancedPublisherRegistry / declare_publisher):"
            echo "$hits"
            exit 1
          fi

      # #484: every queryable goes through zensight_common::served, so the
      # registry-vs-served check knows what this build actually serves.
      - name: queryables are declared through served::serve_queryable (#484)
        run: |
          hits=$(grep -rn '\.declare_queryable(' \
            zensight-common/src zensight-correlator/src \
            zensight-sensor-core/src zensight-sensor-*/src \
            --include='*.rs' \
            | grep -vE 'served\.rs|/tests/|_test\.rs|mod tests' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw declare_queryable — serve through zensight_common::served::serve_queryable so registry coverage (RFC 08 §6.1, #484) can see it:"
            echo "$hits"
            exit 1
          fi

      # #466: keys are base-relative; the deployment base is never spelled.
      - name: application code never spells the deployment base (#466)
        run: |
          cat > /tmp/strip_tests.awk <<'AWK'
          /^#\[cfg\(test\)\]/ { intest=1 }
          { if (!intest) print FILENAME ":" FNR ":" $0 }
          AWK
          SRC="zensight/src zensight-common/src zensight-correlator/src
               zensight-sensor-core/src zensight-sensor-*/src
               zensight-exporter-*/src zensight-rerun/src"
          hits=$(find $SRC -name '*.rs' -print0 \
            | xargs -0 -I{} awk -f /tmp/strip_tests.awk {} \
            | grep -E '"zensight/' \
            | grep -vE 'journald\.cursor|zensight/host-id' \
            | grep -vE ':[0-9]+: *//' || true)
          if [ -n "$hits" ]; then
            echo "::error::A key literal spells the deployment base. Keys are base-relative (#466) — the session namespace adds 'zensight/'. Build them through zenkey/zensight-common:"
            echo "$hits"
            exit 1
          fi

      # #466: the session namespace is set in exactly one place.
      - name: every production session goes through zensight_common::session (#466)
        run: |
          cat > /tmp/strip_tests.awk <<'AWK'
          /^#\[cfg\(test\)\]/ { intest=1 }
          { if (!intest) print FILENAME ":" FNR ":" $0 }
          AWK
          SRC="zensight/src zensight-common/src zensight-correlator/src
               zensight-sensor-core/src zensight-sensor-*/src
               zensight-exporter-*/src zensight-rerun/src"
          hits=$(find $SRC -name '*.rs' -print0 \
            | xargs -0 -I{} awk -f /tmp/strip_tests.awk {} \
            | grep 'zenoh::open(' \
            | grep -vE 'zensight-common/src/session.rs|zensight-rerun/src/session.rs' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw zenoh::open — open sessions via zensight_common::session::{connect,build_config}. It is the only place the deployment namespace (#466) is set:"
            echo "$hits"
            exit 1
          fi
