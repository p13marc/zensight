# Types/constants shared between the sysinfo eBPF kernel programs (no_std,
# bpfel-unknown-none) and the userspace loader. Plain no_std lib — builds on
# stable for the host target, so it is a normal workspace member.
[package]
name = "zensight-sensor-sysinfo-ebpf-common"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]

[lib]
path = "src/lib.rs"

# Test-only: checks the offsets above against the running kernel's BTF.
# A dev-dependency on purpose — cargo never builds a dependency's
# dev-dependencies, so nothing from it can reach the bpfel-unknown-none object
# this crate also feeds (#682).
[dev-dependencies]
zensight-btf = { path = "../zensight-btf" }
