name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Cancel an in-progress run when a newer commit is pushed to the same ref, so we
# don't burn a runner finishing a build that's already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shrink the target dir so the large workspace (zenoh + iced + all sensors and
  # exporters) doesn't exhaust the runner disk. Debuginfo dominates target size;
  # CI doesn't need it. Also disables incremental artifacts. (#52 follow-up: the
  # post-merge run hit "No space left on device".)
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reclaim ~25 GB of preinstalled toolchains we don't use, so the
      # whole-workspace debug build + test binaries fit on disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          # protobuf-compiler: gnmi sensor; libsystemd-dev: journald source in the
          # syslog sensor (default-on `journald` feature links libsystemd).
          sudo apt-get install -y protobuf-compiler libsystemd-dev
          protoc --version

      # Cache the cargo registry/git + build artifacts keyed on Cargo.lock and
      # the toolchain. The zenoh + iced dependency graph dominates compile time
      # and changes rarely, so most runs restore it instead of rebuilding it.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # `cargo test` compiles the whole workspace (libs, bins, and test
      # targets), so it subsumes a separate `cargo build` — one compile pass.
      - name: Build & test
        run: cargo test --workspace --locked

  # Format + lint gate. Kept in its own job so a lint failure is reported
  # independently of (and in parallel with) the build/test job.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          sudo docker image prune --all --force || true

      - name: Install build deps
        run: |
          sudo apt-get update
          # Same native deps as the test job so clippy can compile every crate:
          # protobuf-compiler (gnmi), libsystemd-dev (logs/journald),
          # libssl-dev (snmp via openssl).
          sudo apt-get install -y protobuf-compiler libsystemd-dev libssl-dev

      - name: Install clippy + rustfmt
        run: rustup component add clippy rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # D2 (#28): all colors must come from the design-system modules
      # (view/theme.rs, view/tokens.rs, view/components/). No ad-hoc
      # Color::from_rgb[a] anywhere else — use a theme accessor / constant or
      # kit::rgb() for data colors.
      - name: no ad-hoc colors (D2 guard)
        run: |
          hits=$(grep -rn "Color::from_rgb" zensight/src --include='*.rs' \
            | grep -vE "view/theme\.rs|view/tokens\.rs|view/components/" || true)
          if [ -n "$hits" ]; then
            echo "::error::Ad-hoc Color::from_rgb outside the design-system modules:"
            echo "$hits"
            exit 1
          fi

      # R5 (#356): every publication must go through a *declared* publisher —
      # sensor-core's AdvancedPublisherRegistry / common's PublisherRegistry /
      # a `session.declare_publisher(...)` — never a one-shot `session.put` /
      # `session.delete` (declaring interns the key + primes router routing).
      # v1 (RFC 02 P7): the sanctioned one-shot exemptions — events-class
      # records and @blob chunk seeding — still ride the registry modules, so
      # the ban stands as-is; commands no longer publish at all (they are
      # @rpc GETs, RFC 05). Bans `<session-like>.put(` / `.delete(` outside
      # the registry modules, tests, and zenoh-blob (an external-bound crate
      # with its own transport).
      - name: declared-publishers only (R5 guard)
        run: |
          hits=$(grep -rnE '(session[a-z_]*|zenoh)\.(put|delete)\(' \
            zensight/src zensight-common/src zensight-correlator/src \
            zensight-sensor-core/src zensight-sensor-*/src zensight-exporter-*/src \
            zensight-rerun/src zensight-keyspace/src \
            --include='*.rs' \
            | grep -vE 'publisher_registry\.rs|/tests/|_test\.rs|mod tests' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw session.put/delete — publish through a declared publisher (PublisherRegistry / AdvancedPublisherRegistry / declare_publisher):"
            echo "$hits"
            exit 1
          fi

      # The legacy keyspace is retired (#465): every wire key rides
      # zensight/v1/... . Ban NEW legacy-shaped literals ("zensight/<x>" not
      # followed by v1) in non-test source so the old grammar cannot creep
      # back. Comments and assertions are excluded — negative pins ("must
      # NOT match") and historical notes are legitimate.
      # Catches pre-v1 key literals (`"zensight/snmp/…"`). The version chunk is
      # a plain `v1`, so a legal key literal now *also* starts with a lowercase
      # letter — `zensight/v1/` is the one allowed spelling, and everything else
      # under `"zensight/<lowercase>` is a legacy key that must be built through
      # zensight-keyspace instead. (It whitelisted `zensight/@v1` while the
      # version chunk was verbatim; see grammar::VERSION_CHUNK for why it is not.)
      - name: application code never spells the deployment base (#466)
        run: |
          # Since #466 the base (`zensight`) is the Zenoh session *namespace*:
          # the runtime prefixes it on egress and strips it on ingress, so every
          # key application code builds is base-relative (`v1/...`). A literal
          # `"zensight/...` in app source is therefore always a bug — either a
          # legacy key, or a full key that a namespaced session would re-prefix
          # to `zensight/zensight/...` and match nothing, silently.
          #
          # This used to whitelist `zensight/v1` (the base was spelled by hand).
          # It no longer does, and that is the enforcement that keeps the base
          # out of the vocabulary permanently.
          #
          # Not scanned, deliberately: zenctl and zensight-common/examples are
          # the sanctioned UN-namespaced debug tools (RFC 09 §5) and MUST spell
          # full keys. Router-side configs likewise.
          #
          # `#[cfg(test)]` modules are stripped rather than grepped around: a
          # test legitimately pins the FULL wire key (that is what it is
          # asserting), and `grep -v assert` was too blunt to say so.
          cat > /tmp/strip_tests.awk <<'AWK'
          /^#\[cfg\(test\)\]/ { intest=1 }
          { if (!intest) print FILENAME ":" FNR ":" $0 }
          AWK
          SRC="zensight/src zensight-common/src zensight-correlator/src
               zensight-sensor-core/src zensight-sensor-*/src
               zensight-exporter-*/src zensight-rerun/src zensight-keyspace/src"
          hits=$(find $SRC -name '*.rs' -print0 \
            | xargs -0 -I{} awk -f /tmp/strip_tests.awk {} \
            | grep -E '"zensight/' \
            | grep -vE 'journald\.cursor|zensight/host-id' \
            | grep -vE ':[0-9]+: *//' || true)
          if [ -n "$hits" ]; then
            echo "::error::A key literal spells the deployment base. Keys are base-relative (#466) — the session namespace adds 'zensight/'. Build them through zensight-keyspace/zensight-common:"
            echo "$hits"
            exit 1
          fi

      - name: every production session goes through zensight_common::session (#466)
        run: |
          # The namespace is per-session, and it is set in exactly one place:
          # zensight_common::session::build_config. A component that hand-rolls
          # its own zenoh::Config silently misses it, publishes and subscribes
          # base-relative keys at the BUS ROOT, and goes deaf with no error at
          # all — which is exactly how this change would half-land. There were
          # five such builders before #466; there is one now.
          #
          # zensight-rerun/src/session.rs opens directly, but its config comes
          # FROM build_config (it only adds the isolate delta), so it is
          # sanctioned. zenctl and the examples are deliberately un-namespaced
          # debug tools (RFC 09 §5) and are not scanned.
          cat > /tmp/strip_tests.awk <<'AWK'
          /^#\[cfg\(test\)\]/ { intest=1 }
          { if (!intest) print FILENAME ":" FNR ":" $0 }
          AWK
          SRC="zensight/src zensight-common/src zensight-correlator/src
               zensight-sensor-core/src zensight-sensor-*/src
               zensight-exporter-*/src zensight-rerun/src"
          hits=$(find $SRC -name '*.rs' -print0 \
            | xargs -0 -I{} awk -f /tmp/strip_tests.awk {} \
            | grep 'zenoh::open(' \
            | grep -vE 'zensight-common/src/session.rs|zensight-rerun/src/session.rs' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw zenoh::open — open sessions via zensight_common::session::{connect,build_config}. It is the only place the deployment namespace (#466) is set:"
            echo "$hits"
            exit 1
          fi

      # zenoh-blob is a generic crate meant to graduate to its own repo +
      # crates.io (#202). It must stay free of ZenSight types and path deps so
      # the switch to the published crate is a one-line change. Guard the
      # [dependencies] / [dev-dependencies] section of its Cargo.toml.
      - name: zenoh-blob boundary guard
        run: |
          deps=$(awk '/^\[(dev-)?dependencies\]/{f=1;next} /^\[/{f=0} f' zenoh-blob/Cargo.toml)
          hits=$(echo "$deps" | grep -nE 'zensight|path *=' || true)
          if [ -n "$hits" ]; then
            echo "::error::zenoh-blob must not depend on ZenSight crates or path deps (it graduates to crates.io):"
            echo "$hits"
            exit 1
          fi

  # The self-building sensors image (docker/Dockerfile.sensors) is built by
  # NOTHING: the release pipeline assembles its image from prebuilt binaries via
  # Dockerfile.sensors-runtime, and no test compiles this one. It has therefore
  # been free to rot — a renamed crate, a dropped system library, a moved script
  # would only be discovered by whoever next tried to build it by hand (#472).
  #
  # Post-merge only. It is a full workspace build inside Docker (~15 min); paying
  # that on every PR to catch a file that changes a few times a year is a bad
  # trade, and catching it at merge is still well before a release.
  container-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the all-in-one sensors image
        run: docker build -f docker/Dockerfile.sensors -t zensight-sensors:ci .

      # The image is useless if its entrypoint doesn't run, and the failure mode
      # is a container that exits silently. It must REFUSE to start without a
      # Zenoh endpoint (exit 64) — a sensor with nowhere to publish looks healthy
      # and says nothing, which is the whole failure class this image invites.
      - name: The entrypoint refuses to start with nowhere to publish
        run: |
          set +e
          out=$(docker run --rm zensight-sensors:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 64 ]; then
            echo "::error::expected exit 64 (missing ZENSIGHT_ZENOH_CONNECT), got $code"
            exit 1
          fi

      - name: The bundled sensors are the ones the spawner spawns
        run: |
          # Dockerfile.sensors hardcodes its `cargo build -p` list. If a sensor
          # joins `just run` and nobody updates the Dockerfile, the container
          # quietly ships without it — telemetry that exists on a dev box and not
          # in production is the worst kind of drift.
          for s in sysinfo netlink netring logs systemd; do
            docker run --rm --entrypoint /bin/sh zensight-sensors:ci \
              -c "test -x /usr/local/bin/zensight-sensor-$s" \
              || { echo "::error::zensight-sensor-$s missing from the image"; exit 1; }
          done
