[package]
name = "zensight-rerun"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "EVALUATION-ONLY Rerun visualization adapter for ZenSight telemetry (epic #415)"
# Never published: this crate exists to evaluate Rerun as an optional viz/replay
# backend (docs/plans/rerun/). No other crate may depend on it.
publish = false
# rerun 0.34.1 requires rust 1.92 (crates.io metadata, 2026-07-11). This is the
# only crate in the workspace with an MSRV pin — a deliberate reject-signal
# tracker for the evaluation (see docs/plans/rerun/01-capabilities.md §1).
rust-version = "1.97"

[dependencies]
# Internal crates
zensight-common = { path = "../zensight-common" }
zenkey = { workspace = true }

# Zenoh
zenoh.workspace = true

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Configuration
json5.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# CLI
clap.workspace = true

# Rerun SDK — exact-pinned. default-features = false keeps the viewer
# (egui/wgpu), analytics, dataframe, and server stacks out of the build; `sdk`
# alone provides save() (.rrd) and connect_grpc() (dep-hygiene gate: cargo tree
# must show no re_viewer/wgpu/egui/re_analytics/re_renderer).
#
# THE PIN DOES NOT MOVE ON A RENOVATE PR. #430 decided this crate is an
# optional debugging backend, not a shipped one, and Rerun cuts a breaking
# minor with its own migration guide roughly every six weeks — two of them
# (0.35, 0.36) in the seven weeks after we pinned 0.34.1. An evaluation-only
# crate has no reason to pay that toll on a schedule someone else sets. Move it
# when a concrete need moves it, and update docs/plans/rerun/ when you do.
# Decline the rerun / re_log_encoding / re_log_types rows on dashboard #615.
rerun = { version = "=0.34.1", default-features = false, features = ["sdk"] }

[dev-dependencies]
tempfile.workspace = true
# e2e decode pass on the produced .rrd (already in the rerun dep tree, so this
# adds no meaningful build cost; exact-pinned alongside `rerun`).
re_log_encoding = "=0.34.1"
re_log_types = "=0.34.1"

