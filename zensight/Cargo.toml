[package]
name = "zensight"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZenSight - Observability frontend for Zenoh telemetry"

[lib]
name = "zensight"
path = "src/lib.rs"

[[bin]]
name = "zensight"
path = "src/main.rs"

[dependencies]
zensight-common.workspace = true
zenoh.workspace = true
zenoh-ext.workspace = true
# Large-data (debug-report) download client (#197).
zenoh-blob.workspace = true
ulid.workspace = true
# Decompress a saved `.pcap.zst` capture back to `.pcap` on save (#333).
zstd.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
json5.workspace = true

# GUI
# `image-without-codecs` enables the iced image widget WITHOUT pulling
# `image/default` (which drags in AVIF/ravif → profiling-procmacros, unwanted +
# heavy). We decode JPEG ourselves via the `image` crate below (jpeg codec
# only) into RGBA, so no codec support is needed inside iced.
iced = { version = "0.14", features = ["tokio", "canvas", "svg", "image-without-codecs"] }
iced_anim = { version = "0.3", features = ["widgets", "derive"] }
# JPEG-only decode for media-plane preview frames (#359); no default codecs so
# AVIF/ravif never enter the graph. We decode to RGBA and hand iced a raw handle.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Async utilities
async-stream = "0.3"
# Unbounded channels for the Zenoh subscribers (must match zenoh's flume so the
# (Sender, Receiver) pair satisfies zenoh's IntoHandler impl).
flume = "0.11"

# Random number generation (for demo mode)
rand = "0.9"

# Platform utilities
dirs.workspace = true
rfd.workspace = true
notify-rust.workspace = true
# Date/time parsing for the absolute chart range picker (#36).
chrono = "0.4"

# Local tiered time-series store (Plan v3-04 §A): pure-Rust, ACID, zero-copy.
redb = "4"

# H.264 decode for the opt-in live view (#409); `h264` feature only.
parallax-pipeline = { version = "0.1.2", default-features = false, features = [
    "h264",
], optional = true }

[features]
default = []
# Enable the tester developer tool (F12 to record/play tests)
tester = ["iced/tester"]
# Opt-in H.264 live view for parallax streams (#409). Default OFF: it pulls
# openh264 (a C++ build from source), unacceptable unconditionally on
# GUI/CI/flatpak builds. `cargo build -p zensight --features h264`.
h264 = ["dep:parallax-pipeline"]

[dev-dependencies]
iced_test = "0.14"

# =============================================================================
# Package metadata for cargo-deb
# =============================================================================
[package.metadata.deb]
maintainer = "Marc Pardo <p13marc@gmail.com>"
copyright = "2024, Marc Pardo"
license-file = ["../LICENSE", "0"]
extended-description = """ZenSight is a unified observability platform that bridges legacy
monitoring protocols into Zenoh's pub/sub infrastructure. This package
provides the desktop frontend for visualizing telemetry data."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/zensight", "usr/bin/", "755"],
    ["../flatpak/com.github.p13marc.ZenSight.desktop", "usr/share/applications/", "644"],
    ["../flatpak/icons/hicolor/scalable/apps/com.github.p13marc.ZenSight.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
depends = "$auto"

# =============================================================================
# Package metadata for cargo-generate-rpm
# =============================================================================
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/zensight", dest = "/usr/bin/zensight", mode = "755" },
    { source = "../flatpak/com.github.p13marc.ZenSight.desktop", dest = "/usr/share/applications/com.github.p13marc.ZenSight.desktop", mode = "644" },
    { source = "../flatpak/icons/hicolor/scalable/apps/com.github.p13marc.ZenSight.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.github.p13marc.ZenSight.svg", mode = "644" },
]
