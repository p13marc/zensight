# The all-in-one ZenSight sensors container, as Compose.
#
#   ZENSIGHT_ZENOH_CONNECT=tcp/<gui-host>:7447 docker compose -f docker/docker-compose.yml up
#
# The canonical invocation is the `podman run` in docs/DEPLOYMENT.md; this file
# is that same invocation, and must stay that same invocation. If you change one,
# change the other.
#
# ONE service, not one per sensor. The image bundles the five host sensors that
# `just run` spawns (sysinfo, netlink, netring, logs, systemd) behind the shared
# spawner (scripts/run-sensors.sh): they observe the *same host*, so splitting
# them across containers buys nothing but five copies of the host namespaces to
# get wrong. The correlator is deliberately absent — it must run exactly once per
# deployment, next to the GUI (`just correlator`).
#
# Every flag below is load-bearing, and dropping one makes a sensor go *quiet*
# rather than fail, which is the worst way to find out. See DEPLOYMENT.md §"What
# the flags buy" for the full table; the one that is not obvious:
#
#   /etc/machine-id  is THE ORIGIN (RFC 06 §1). Without it every container mints
#                    a fresh random origin at each start, so a restart looks like
#                    a brand-new host and the catalog accumulates ghosts.

services:
  sensors:
    image: ghcr.io/p13marc/zensight-sensors:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.sensors

    # The one supported knob. The entrypoint refuses to start without it: a
    # sensor with nowhere to publish is a sensor that looks fine and says nothing.
    environment:
      ZENSIGHT_ZENOH_CONNECT: ${ZENSIGHT_ZENOH_CONNECT:?set it to tcp/<gui-host>:7447}

    network_mode: host   # netring captures on the host's ifaces; netlink sees its sockets
    pid: host            # sysinfo's process explorer sees the host's processes
    userns_mode: host    # rootful: these are host-observing agents (DEPLOYMENT.md)

    cap_add:
      - NET_RAW    # netring: AF_PACKET capture
      - NET_ADMIN  # netlink: nftables/conntrack + the XFRM monitor
      - IPC_LOCK   # netring: the AF_XDP path (locked memory)

    security_opt:
      - label=disable

    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro

    restart: on-failure
