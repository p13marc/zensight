# Subject registry: parallax (live video). RFC 08 §2; migration epic #453.
# Telemetry metric trees register as {metric...} families (one payload type,
# TelemetryPoint) — typed per-metric refinement is additive (registry MINOR).

[registry]
version = "1.0"
app = "zensight"
convention = 1

[producer]
name = "parallax"
description = "live video (V4L2/RTSP/test) -> H.264 + JPEG previews on @media"

[[subject]]
path = "{metric...}"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 200
since = "1.0"
description = "per-stream stats (fps/kbps/drops/viewers)"
[[subject]]
path = "stream/{stream}"
class = "state"
type = "StreamDoc"
cardinality = 16
ttl_s = 900
since = "1.0"
description = "stream catalogue + status doc (open?, viewers, profile); tombstone on removal from config, NOT on close (RFC 05 §5)"
[[subject]]
path = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework; absorbs the legacy @/status running flag)"

[[subject]]
path = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim (RFC 06 §4)"

[[subject]]
path = "alert/{alert_key}"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 64
ttl_s = 900
since = "1.0"
description = "alerts; firing->resolved on one key, delete = tombstone"

[[subject]]
path = "artifact/{kind}"
class = "state"
type = "ArtifactStatus"
cardinality = 8
ttl_s = 900
since = "1.0"
description = "artifact lifecycle status doc per kind (RFC 05 §3 long-running pattern; tombstoned when freed)"
[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "artifact/request"
kind = "write"
request = "ArtifactRequest"
reply = "ArtifactAck"
since = "1.0"
description = "initiate artifact generation; replies { id } immediately (RFC 05 §3)"

[[procedure]]
path = "artifact/cancel"
kind = "write"
reply = "Ack"
since = "1.0"
description = "free an in-flight/ready artifact early (?id=<ulid>)"
[[procedure]]
path = "streams"
kind = "read"
reply = "Vec<StreamDescriptor>"
idempotent = true
since = "1.0"
description = "the configured stream catalogue (descriptors incl. open state)"
[[procedure]]
path = "stream/set"
kind = "write"
request = "Command<StreamControl>"
reply = "Ack"
idempotent = false
since = "1.0"
description = "stream control: open_stream / close_stream / request_keyframe"
[[media]]
path = "{stream}/video/{codec}/{profile}"
encoding = "video/*"
attachment = "FrameMeta"
since = "1.0"
[[media]]
path = "{stream}/preview/jpeg"
encoding = "image/jpeg"
attachment = "FrameMeta"
since = "1.0"
