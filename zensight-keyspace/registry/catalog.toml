# Subject registry: @catalog (identity/ontology service). RFC 06, RFC 08 §2.

[registry]
version = "1.0"
app = "zensight"
convention = 1

[service]
name = "catalog"
origin = "@catalog"
description = "identity/ontology service (zensight-correlator); single writer via the RFC 06 §5.3 claim protocol"

[[subject]]
path = "entity/{entity_id}"
class = "state"
type = "HostEntity"
cardinality = 10000
ttl_s = 900
since = "1.0"
description = "merged entity document (LWW, tombstoned on retire/merge)"

[[subject]]
path = "alias/{old_id}"
class = "state"
type = "AliasRecord"
cardinality = 1000
ttl_s = 31536000
since = "1.0"
description = "old-id -> entity-id re-pointing on merges/upgrades; operator-retained (RFC 06 §5.4)"

[[subject]]
path = "pdns/{ip_slug}"
class = "state"
type = "PdnsRecord"
cardinality = 100000
ttl_s = 86400
since = "1.0"
description = "accumulated IP<->name record; history = storage capture (RFC 06 §5.2; population-budgeted)"

[[procedure]]
path = "names"
kind = "read"
reply = "Vec<NameVal>"
idempotent = true
since = "1.0"
description = "on-demand name resolution (?ip=...)"
[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"
