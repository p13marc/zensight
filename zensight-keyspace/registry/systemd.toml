# Subject registry: systemd (unit/boot telemetry). RFC 08 §2; migration epic #453.
# Telemetry metric trees register as {metric...} families (one payload type,
# TelemetryPoint) — typed per-metric refinement is additive (registry MINOR).

[registry]
version = "1.0"
app = "zensight"
convention = 1

[producer]
name = "systemd"
description = "systemd unit/boot telemetry (D-Bus) + sentinel + gated actions"

[[subject]]
path = "{metric...}"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 2000
since = "1.0"
description = "unit/boot/cgroup metric tree"
[[subject]]
path = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework; absorbs the legacy @/status running flag)"

[[subject]]
path = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim (RFC 06 §4)"

[[subject]]
path = "artifact/{kind}"
class = "state"
type = "ArtifactStatus"
cardinality = 8
ttl_s = 900
since = "1.0"
description = "artifact lifecycle status doc per kind (RFC 05 §3 long-running pattern; tombstoned when freed)"

[[subject]]
path = "alert/{alert_key}"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 64
ttl_s = 900
since = "1.0"
description = "alerts; firing->resolved on one key, delete = tombstone"
[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "artifact/request"
kind = "write"
request = "ArtifactRequest"
reply = "ArtifactAck"
since = "1.0"
description = "initiate artifact generation; replies { id } immediately (RFC 05 §3)"

[[procedure]]
path = "artifact/cancel"
kind = "write"
reply = "Ack"
since = "1.0"
description = "free an in-flight/ready artifact early (?id=<ulid>)"
[[procedure]]
path = "expectations"
kind = "read"
reply = "TopicStatus"
idempotent = true
since = "1.0"
description = "current expectations configuration (sentinel expectations hot-swap)"

[[procedure]]
path = "expectations/set"
kind = "write"
request = "ExpectationsConfig"
reply = "Ack"
since = "1.0"
description = "apply expectations configuration (sentinel expectations hot-swap)"
[[procedure]]
path = "action"
kind = "write"
request = "ServiceAction"
reply = "Ack"
idempotent = false
since = "1.0"
description = "gated service control {verb,unit} — default OFF, allowlist + polkit; refuses with error/gated"
[[procedure]]
path = "units"
kind = "read"
reply = "Vec<UnitRecord>"
idempotent = true
since = "1.0"
description = "unit table"

[[procedure]]
path = "failed"
kind = "read"
reply = "Vec<UnitRecord>"
idempotent = true
since = "1.0"
description = "failed units"

[[procedure]]
path = "unit"
kind = "read"
reply = "UnitDetail"
idempotent = true
since = "1.0"
description = "one unit's detail (?name=<u>)"

[[procedure]]
path = "timers"
kind = "read"
reply = "Vec<TimerRecord>"
idempotent = true
since = "1.0"
description = "timer table"

[[procedure]]
path = "events"
kind = "read"
reply = "Vec<EventRecord>"
idempotent = true
since = "1.0"
description = "unit event ring"

[[procedure]]
path = "cgroups"
kind = "read"
reply = "CgroupNode"
idempotent = true
since = "1.0"
description = "cgroup subtree (?path=<rel>)"
