[package]
name = "zensight-sensor-core"
description = "Common framework for ZenSight protocol sensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace dependencies
zensight-common = { workspace = true }
zenkey = { workspace = true }
dirs = { workspace = true }
# `internal` gates the per-publication `.encoding()` / `.attachment()` builder
# methods used by the raw media-plane publisher (#359). zenoh-ext already pulls
# it in; we depend on it explicitly rather than relying on feature unification.
zenoh = { workspace = true, features = ["internal"] }
zenoh-ext = { workspace = true }
# Unbounded channel for the @desired reconciler's AdvancedSubscriber (#816)
# — must match zenoh's flume so the (Sender, Receiver) pair satisfies
# IntoHandler (the correlator makes the same choice for the same reason).
flume = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
json5 = { workspace = true }

# Time
chrono = "0.4"

# Debug-report transfer + bundling (#196)
zblob = { workspace = true }
# Volatile-mode snapshot tags live in a channel-owned private temp dir.
tempfile = { workspace = true }
ulid = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

# Artifact producer registry (#332)
async-trait = { workspace = true }

# Host identity envelope (#301)
sha2 = { workspace = true }
hostname = { workspace = true }
if-addrs = { workspace = true }

# The memory governor's malloc_trim (#812): return evicted heap to the
# kernel so the ladder can observe its own progress. glibc-only call, gated
# cfg(target_env = "gnu") in governor.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
# `artifact_channel` reads the audit trail back: without the `linux-audit`
# feature `audit::record` always takes its `tracing` fallback, so capturing the
# `zensight::audit` target is how a test sees `res=0` (#1085).
tracing-subscriber.workspace = true

# `governor_ladder` pins the allocator's mmap threshold so its ballast is
# memory the kernel actually reclaims on free — see the note at the top of
# that test. Measuring RSS means controlling what RSS reflects.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
