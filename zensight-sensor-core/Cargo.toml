[package]
name = "zensight-sensor-core"
description = "Common framework for ZenSight protocol sensors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace dependencies
zensight-common = { workspace = true }
# `internal` gates the per-publication `.encoding()` / `.attachment()` builder
# methods used by the raw media-plane publisher (#359). zenoh-ext already pulls
# it in; we depend on it explicitly rather than relying on feature unification.
zenoh = { workspace = true, features = ["internal"] }
zenoh-ext = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
json5 = { workspace = true }

# Time
chrono = "0.4"

# Debug-report transfer + bundling (#196)
zenoh-blob = { workspace = true }
ulid = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
tempfile = { workspace = true }

# Artifact producer registry (#332)
async-trait = { workspace = true }

# Host identity envelope (#301)
sha2 = { workspace = true }
hostname = { workspace = true }
if-addrs = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
