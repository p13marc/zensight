[package]
name = "zensight-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Common types and utilities for ZenSight observability sensors"

[dependencies]
# Formatting only, for the RFC 3339 instant a `Page`'s `covers_from` must
# carry (#1157/#1067): the generic reader takes that field with `as_str()`, so
# an epoch-millis number is read as *absent*. `clock` is off — nothing here
# asks the OS what time it is, and every sensor already pulls chrono through
# `zensight-sensor-core`, so this adds nothing to a producer's tree.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
# `decode` is on unconditionally, and costs nothing: it pulls only `ciborium`,
# which this crate already depends on directly. It is what makes
# `zenkey::schema::validate::{Verdict, NotValidated}` exist in *every* build —
# so a binary without the `validate-json` feature can still answer
# `NotValidated::FeatureOff` rather than having no way to say "not checked"
# (#741). `jsonschema` is the weight, and that stays behind the feature.
zenkey = { workspace = true, features = ["schemars", "decode"] }
zenoh.workspace = true
# Silence matchers (#922): `MatchOp::Regex` over origin/producer/source/rule/
# labels. The alternative — glob only — cannot express "every host in rack 3",
# which is the shape a maintenance window actually has.
regex.workspace = true
# The exporters' shared subscriber uses an AdvancedSubscriber (history +
# recovery), matching how sensors publish and how the GUI has always consumed
# (#763). Already a workspace dep used by sensor-core, the correlator and the GUI.
zenoh-ext.workspace = true
tokio.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
ciborium.workspace = true
json5.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
ulid = { workspace = true }
zblob = { workspace = true }
# `action::allows` is the one allowlist rule, shared by the systemd sensor's
# gate and the frontend's pre-click preview — two implementations would drift.
glob.workspace = true
# Only for the `validate-json` feature (#741) — draft-2020-12 payload
# conformance. Never in a default (sensor) build.
jsonschema = { workspace = true, optional = true }
# Only for the `linux-audit` feature (#957) — one AUDIT_USYS_CONFIG datagram on
# a NETLINK_AUDIT socket. `default-features = false` keeps it to the plain
# `Socket`: no tokio, no mio, no futures. Already in the lock file as a
# transitive dependency, and MIT — see the feature comment.
netlink-sys = { version = "0.8", default-features = false, optional = true }

[features]
default = []
# RFC 08 §7 payload conformance: real draft-2020-12 validation of a decoded
# payload against the `describe` schema for its declared type (#741).
#
# OFF by default and deliberately so. `jsonschema` is real weight, and a sensor
# has no use for it: a producer validating its own payload against its own
# derived schema is checking `schemars` against `schemars`. The consumer that
# has a use is a *payload inspector* — something looking at somebody else's
# bytes and asking whether they conform.
#
# The GUI turns it on (its default `validate` feature, #791) — in the same
# change that gave it somewhere to show the answer: the bus explorer's
# inspector (#748) and the fleet-RPC status panels render the three states
# through `zensight/src/view/components/verdict.rs`. Sensors still have no
# use for it and still don't enable it.
#
# Without it, `schema::verdict_for` answers
# `Verdict::NotValidated(NotValidated::FeatureOff)` — never a fake "valid".
validate-json = ["zenkey/validate-json", "dep:jsonschema"]

# SYS-SUP-019 (#957): deliver every write procedure's outcome to the host's
# audit subsystem instead of only to our own log.
#
# OFF by default, the same rule as `icmp`/`ebpf`/`nvml`: writing to
# `NETLINK_AUDIT` needs CAP_AUDIT_WRITE, which a container deployment does not
# have and must not be made to want. Without the feature — and with it, on a
# host with no audit socket — `audit::record` logs the same fields under the
# `zensight::audit` target instead. It never drops a record and never fails a
# call.
#
# Named `linux-audit`, not `libaudit` as #957 first sketched it, because it
# does NOT link the LGPL-2.1+ C library: it writes the netlink datagram
# directly (MIT `netlink-sys`, already in the lock file), so `deny.toml` needs
# no new licence exception and no build host needs `libaudit-dev`. A feature
# named after a library it does not use is a name that has to be apologised
# for at every reading.
linux-audit = ["dep:netlink-sys"]

[build-dependencies]
# Compiles registry/*.toml into the typed subject registry (RFC 08 §5).
zenkey-build = { workspace = true }

[dev-dependencies]
# router_storage.rs gives each zenohd run a fresh ZENOH_BACKEND_FS_ROOT, so a
# test cannot pass on the previous run's stored data.
tempfile.workspace = true
