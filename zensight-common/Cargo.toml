[package]
name = "zensight-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Common types and utilities for ZenSight observability sensors"

[dependencies]
zenkey = { workspace = true, features = ["schemars"] }
zenoh.workspace = true
# The exporters' shared subscriber uses an AdvancedSubscriber (history +
# recovery), matching how sensors publish and how the GUI has always consumed
# (#763). Already a workspace dep used by sensor-core, the correlator and the GUI.
zenoh-ext.workspace = true
tokio.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
ciborium.workspace = true
json5.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
ulid = { workspace = true }
zblob = { workspace = true }
# `action::allows` is the one allowlist rule, shared by the systemd sensor's
# gate and the frontend's pre-click preview — two implementations would drift.
glob.workspace = true

[build-dependencies]
# Compiles registry/*.toml into the typed subject registry (RFC 08 §5).
zenkey-build = { workspace = true }

[dev-dependencies]
# router_storage.rs gives each zenohd run a fresh ZENOH_BACKEND_FS_ROOT, so a
# test cannot pass on the previous run's stored data.
tempfile.workspace = true
