# Subject registry: netring (wire-level flow/L7/NDR). RFC 08 §2; migration epic #453.
# Telemetry is registered as real subjects, not a `{metric...}` catch-all
# (issue #468) — see registry/sysinfo.toml for the rule and why.
# Source: src/map.rs (every metric name).

[registry]
version = "1.3"
app = "zensight"
convention = 1

[producer]
name = "netring"
description = "wire-level flow/L7/NDR sensor"

