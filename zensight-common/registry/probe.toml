# Subject registry: probe (outside-in synthetic checks). RFC 08 §2; issue #820.
#
# Everything else ZenSight measures is INSIDE. Nothing checked that the thing
# works from outside — that the site answers, that the certificate is valid,
# that the name resolves, that the port is reachable from where a user is.
#
# That gap cost eight days on 2026-08-20: a reboot dropped an /etc/hosts entry,
# a guest resolved a name to a public IP it cannot reach, cosign and Renovate
# broke, and the diagnosis eventually hinged on someone noticing that failing
# CI runs took 2m16s — a 20 s connect timeout — and that the forge's router log
# showed zero requests. A guest-side probe would have said "timeout, 20 s" in
# one interval. Two issues were filed on an expired-token theory first.
#
# Targets are the <device>s; the origin stays the probing host's. The SAME
# target checked from the edge, from a guest and from a workstation gives three
# different and equally true answers, so `vantage` rides in every document and
# every alert — without it those three are indistinguishable.
#
# This sensor is a CLIENT ONLY. It makes the requests an operator configures
# and nothing else. The one `write` procedure below, `thresholds/set` (#931),
# rewrites the rule set this sensor evaluates against its OWN telemetry — it
# reaches no target, and `kind = "write"` there buys the #957 audit record for
# "who changed the rules", not permission to act. No procedure below can
# acquire more than that.

[registry]
version = "1.5"
app = "zensight"
convention = 1

[producer]
name = "probe"
description = "outside-in synthetic checks (#820): HTTP status/latency/redirects, TLS chain + days-to-expiry, DNS with the resolver named, TCP connect, optional ICMP — plus local certificate files, which need no network at all"

# ── Per-target telemetry ─────────────────────────────────────────────────────

[[subject]]
path = "{target}/up"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "1 when the check succeeded, 0 otherwise — published every interval, so a failing target reads as 0 and never as silence"

[[subject]]
path = "{target}/duration_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "total elapsed, milliseconds. Published on a TIMEOUT too: the duration IS the diagnosis — 20 s of connect timeout is what the 2026-08-20 hairpin looked like, and recognising it took eight days"

[[subject]]
path = "{target}/timeout"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "1 when the check timed out rather than failing — a connection that hangs is a different diagnosis from one that is refused"

[[subject]]
path = "{target}/http_status"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "HTTP status code, when one was received"

[[subject]]
path = "{target}/http_ttfb_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "time to first byte, milliseconds — separates a slow server from a slow network"

[[subject]]
path = "{target}/tls_days_to_expiry"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "days until notAfter; NEGATIVE once expired, because clamping would make 'expired an hour ago' and 'expires in a month' look equally survivable"

[[subject]]
path = "{target}/tls_chain_valid"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "1 when the presented chain validated against the trust store"

[[subject]]
path = "{target}/dns_answers"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "how many records the resolver returned"

[[subject]]
path = "{target}/rtt_min_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.2"
description = "fastest round trip in the burst (#958); absent when every probe was lost"

[[subject]]
path = "{target}/rtt_avg_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.2"
description = "mean round trip over the answering probes in the burst (#958)"

[[subject]]
path = "{target}/rtt_max_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.2"
description = "slowest round trip in the burst (#958)"

[[subject]]
path = "{target}/rtt_p95_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.2"
description = "95th-percentile round trip, nearest-rank (#958)"

[[subject]]
path = "{target}/jitter_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.2"
description = "mean absolute inter-packet delay variation (RFC 3393 IPDV) over CONSECUTIVE successful probes (#958); absent below two consecutive successes"

[[subject]]
path = "{target}/loss_pct"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.2"
description = "percentage of the burst's probes that did not answer (#958); published even at 100%, where the RTT series are absent rather than zero"

[[subject]]
path = "{target}/ntp_offset_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.3"
description = "clock offset from the time server, in ms, positive when the SERVER is ahead of the probe host (#959); measured against the probe host's own clock, so pair it with state/sysinfo/timesync"

[[subject]]
path = "{target}/ntp_delay_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.3"
description = "round-trip delay to the time server, in ms (RFC 4330 §5) (#959)"

[[subject]]
path = "{target}/ntp_stratum"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.3"
description = "the server's distance from a reference clock; 0 is a kiss-o'-death refusal and never a valid time source (#959)"

[[subject]]
path = "{target}/ntp_synchronised"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.3"
description = "1 when the server reports itself usable — leap indicator below 3 and stratum above 0 (#959)"

[[subject]]
path = "targets/total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "configured targets"

[[subject]]
path = "targets/failing"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "targets whose last check did not succeed"

# ── State documents ──────────────────────────────────────────────────────────

[[subject]]
path = "target/{target}"
class = "state"
type = "ProbeResult"
cardinality = 512
ttl_s = 900
since = "1.0"
description = "the full result: outcome (ok/failed/TIMEOUT as distinct states), duration, the checker's own error text, and the per-kind detail — HTTP status + redirect chain, TLS issuer/SANs/expiry, DNS answers WITH THE RESOLVER NAMED"

# ── Framework subjects ───────────────────────────────────────────────────────

[[subject]]
path = "health"
common = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework)"

[[subject]]
path = "errors"
common = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
common = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/relation/{relation_id}"
common = "evidence_relation"
class = "state"
type = "RelationshipEvidence"
cardinality = 1024
ttl_s = 900
since = "1.1"
description = "a Probes claim: this vantage point checks this target (#915); the catalog resolves both ends into an @catalog edge"

[[subject]]
path = "evidence/self"
common = "evidence_self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim of the probing host — which is load-bearing here: the vantage point is half the answer (RFC 06 §4)"

[[subject]]
path = "alert/{alert_key}"
common = "alert"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 128
ttl_s = 900
since = "1.0"
description = "probe assertions: target down, timed out, unexpected status, body missing, certificate expiring or expired, chain invalid, SAN mismatch, DNS answer unexpected, redirect off-host"

# ── Procedures ───────────────────────────────────────────────────────────────

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.0"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"

[[subject]]
path = "applied/{topic}"
class = "state"
type = "AppliedConfig"
cardinality = 8
ttl_s = 900
since = "1.4"
description = "effective config actually in force for {topic} (#931): source file|desired|rpc, the effective doc, the last rejected desired doc"

# Operator-authored threshold rules (#931). Three writers — file, `@desired`,
# this pair — and one `applied/thresholds` marker that says which of them is
# actually in force. The set ships EMPTY: this build has no threshold that
# fires, only ones an operator chose.
[[procedure]]
path = "thresholds"
kind = "read"
reply = "ThresholdsConfig"
idempotent = true
since = "1.4"
description = "the threshold rule set currently evaluated against this producer's own telemetry"

# Runtime target sets (#936). Which devices this sensor polls stops being a
# restart-only decision: `@desired` carries the whole set for this host and
# these two carry an operator's ad-hoc change, with
# `state/probe/applied/targets` saying which went last.
#
# `fanout = "forbidden"` on the write, unlike `thresholds/set`. A threshold is
# the same rule wherever it lands; a target set is NOT — every host would be
# told to poll the same devices from every vantage, which for probe is
# nonsense (the vantage is the measurement) and for SNMP is a fleet-wide
# duplicate poll of every device. A fleet-wide target change is what
# `@desired` is for, and it is per-host by construction there.
#
# The wire type has no `headers` field, so a request cannot carry one and a reply cannot leak one — headers stay in the host's file config, matched to a target by name.
[[procedure]]
path = "targets"
kind = "read"
reply = "ProbeTargets"
idempotent = true
since = "1.5"
description = "the target set this sensor is polling right now, as the wire type — which omits every credential"

[[procedure]]
path = "targets/set"
kind = "write"
fanout = "forbidden"
request = "ProbeTargets"
reply = "Ack"
since = "1.5"
description = "replace the target set without a restart; validated (names unique, slug-safe, non-empty; credential names known) before apply — refuses with error/invalid-args and the previous set keeps polling"

[[procedure]]
path = "thresholds/set"
kind = "write"
fanout = "allowed"  # operator-console fleet push (G2: explicit, deliberate)
request = "ThresholdsConfig"
reply = "Ack"
since = "1.4"
description = "replace the threshold rule set; validated (metric globs, operators, durations, unique names) before apply — refuses with error/invalid-args and the previous set keeps running"
