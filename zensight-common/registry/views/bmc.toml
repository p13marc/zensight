# The bmc view (#1259, design §6.2; #1260 replaces `specialized/bmc.rs` with
# it): what the Rust view said, as a document. Every honesty rule (#1127) is
# structure: "no fan threshold" is the ABSENCE of a grade; "absent ≠ 0" is
# `grade.absent` naming the presence field; "not metered" is a graded reading
# nobody published; "the limit is the publisher's" because `warning`/`critical`
# name sibling fields and nothing else. One card per chassis (`group_by`).
[view]
version  = "1"
producer = "bmc"
title    = "Out-of-band hardware"
group_by = "{chassis}"

[[panel]]
kind   = "facts"
title  = "Chassis"
scope  = "{chassis}"
fields = ["reachable"]
note   = { rhai = "if row.reachable == 0.0 { \"The BMC did not answer this cycle — the readings below are the last it gave\" } else { \"The BMC answered this cycle\" }" }

[[panel]]
kind  = "table"
title = "Temperatures"
scope = "{chassis}/thermal/{sensor}"
label = "$sensor"
[panel.grade]
reading  = "celsius"
warning  = "upper_warning_c"
critical = "upper_critical_c"

[[panel]]
kind  = "table"
title = "Fans"
scope = "{chassis}/fan/{fan}"
label = "$fan"
# no grade: the BMC publishes no fan threshold, and this file may not invent one

[[panel]]
kind   = "table"
title  = "Power supplies"
scope  = "{chassis}/psu/{psu}"
label  = "$psu"
fields = ["input_watts", "capacity_watts", "present"]
[panel.grade]
reading  = "input_watts"
critical = "capacity_watts"
absent   = "present"

[[panel]]
kind  = "table"
title = "Drives"
scope = "{chassis}/drive/{drive}"
label = "$drive"
