# Subject registry: parallax (live video). RFC 08 §2; migration epic #453.
# Telemetry is registered as real subjects, not a `{metric...}` catch-all
# (issue #468) — see registry/sysinfo.toml for the rule and why.
# Source: src/stats.rs.
#
# `{stream}/stats/{metric}` has a *variable* head chunk — there is no literal
# prefix — so it structurally matches anything whose 2nd chunk is `stats`. A
# stream named `streams` would shadow `streams/advertised`; literal-first
# precedence keeps the literal winning, so the shadow costs the stream, not the
# gauge.

[registry]
version = "1.10"
app = "zensight"
convention = 1

[producer]
name = "parallax"
description = "live video (V4L2/RTSP/test) -> H.264 + JPEG previews on @media"

[[subject]]
path = "streams/advertised"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "streams in this host's catalogue"

[[subject]]
path = "{stream}/stats/fps"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.1"
description = "frames per second"

[[subject]]
path = "{stream}/stats/kbps"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.1"
description = "encoded bitrate"

[[subject]]
path = "{stream}/stats/drops"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.1"
description = "buffers a profile's AppSink shed because the egress task did not pull in time, read from AppSinkHandle::stats().total_dropped and folded as a delta per profile incarnation; covers video tiers AND the preview since 1.9, and is NOT transport loss (congestion dies inside Zenoh's queue, upstream of every counter here)"

[[subject]]
path = "{stream}/stats/rc_drops"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.6"
description = "frames the encoder's rate control swallowed to hold the tier's bitrate cap; disjoint from drops (a swallowed frame produces no buffer at all, so it never reaches the sink)"

[[subject]]
path = "{stream}/stats/sink_queue"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.9"
description = "deepest AppSink backlog across the stream's open profiles at tick time (0..SINK_QUEUE); the queue that precedes shedding, so a reading at the cap proves a real backlog while a 0 does not disprove one"

[[subject]]
path = "{stream}/stats/viewers"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.1"
description = "subscribers on the @media plane"

[[subject]]
path = "{stream}/stats/encode_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.1"
description = "encode time per frame"

[[subject]]
path = "{stream}/stats/encode_p95_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.7"
description = "95th-percentile encode time per frame, from the encoder's own histogram; all-time for the tier's encoder incarnation, not an interval figure like encode_ms"

[[subject]]
path = "{stream}/stats/encode_p99_ms"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.7"
description = "99th-percentile encode time per frame; see encode_p95_ms"

# The receiver-feedback aggregate (#715, RFC 07 §1.1/§1.2).
#
# What consumers report on `@rpc/parallax/stream/report`, folded per tier and
# published so it is observable rather than only queryable. Four things about
# this family are contract, not preference:
#
#   * `{tier}` is a required chunk. "Per-tier worst case and median" cannot be
#     spelled without it, and a stream-level average would hide the case the
#     whole epic exists for — one tier healthy, another not.
#   * A max AND a median, never one number. A worst-of-medians understates and
#     a median-of-instants is noise; the report carries both so the aggregate
#     can too.
#   * The timing families are OMITTED, never zero, when no live report measured
#     one (RFC 07 §1.3: unstamped is "not asked"). Same discipline as
#     `stats/rc_drops`.
#   * The producer publishes these and MUST NOT act on them to re-tune a shared
#     tier (RFC 07 §1.2, normative). They inform an operator and a receiver-side
#     controller; they do not drive an encoder.

[[subject]]
path = "{stream}/rx/{tier}/consumers"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "consumers with a live report on this tier. A LOWER BOUND on viewers, not a viewer count: a viewer that never reports is invisible here. See stats/viewers for the publisher-side count"

[[subject]]
path = "{stream}/rx/{tier}/loss_pct_max"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "worst lost/(received+lost) across live reports on this tier"

[[subject]]
path = "{stream}/rx/{tier}/loss_pct_p50"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "median lost/(received+lost) across live reports on this tier"

[[subject]]
path = "{stream}/rx/{tier}/frame_age_ms_max"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "max reported frame age; observed skewed latency (RFC 07 Section 1.3), negatives published unclamped, omitted entirely when no consumer measured one"

[[subject]]
path = "{stream}/rx/{tier}/frame_age_ms_p50"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "median reported frame age; same clock and same omission rule as frame_age_ms_max"

[[subject]]
path = "{stream}/rx/{tier}/decode_queue_max"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "max reported decoder queue depth; omitted when no consumer has a queue to report"

[[subject]]
path = "{stream}/rx/{tier}/decode_queue_p50"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.8"
description = "median reported decoder queue depth; same omission rule"

[[subject]]
path = "stream/{stream}"
class = "state"
type = "StreamStatus"
cardinality = 16
ttl_s = 900
since = "1.0"
description = "stream catalogue + status doc (open?, per-tier applied params + viewers, and why the last tier stopped); tombstone on removal from config, NOT on close (RFC 05 §5)"
[[subject]]
path = "health"
common = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework; absorbs the legacy @/status running flag)"

[[subject]]
path = "errors"
common = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
common = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
common = "evidence_self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim (RFC 06 §4)"

[[subject]]
path = "alert/{alert_key}"
common = "alert"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 64
ttl_s = 900
since = "1.0"
description = "alerts; firing->resolved on one key, delete = tombstone"

[[subject]]
path = "artifact/{kind}"
class = "state"
type = "ArtifactStatus"
cardinality = 16
ttl_s = 900
since = "1.1"
description = "per-kind artifact progress (framework: V1Context::artifact_status_key)"

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.4"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"

[[procedure]]
path = "artifact/request"
kind = "write"
request = "ArtifactRequest"
reply = "ArtifactAck"
since = "1.0"
description = "initiate artifact generation; replies { id } immediately (RFC 05 §3)"

[[procedure]]
path = "artifact/cancel"
kind = "write"
reply = "Ack"
since = "1.0"
description = "free an in-flight/ready artifact early (?id=<ulid>)"

[[procedure]]
path = "artifact/status"
kind = "read"
reply = "ArtifactStatus"
idempotent = true
since = "1.0"
description = "advertised artifact kinds + the in-flight/ready state per kind (RFC 05 §3)"
[[procedure]]
path = "streams"
kind = "read"
reply = "Vec<StreamDescriptor>"
idempotent = true
since = "1.0"
description = "the configured stream catalogue (descriptors incl. open state)"
[[procedure]]
path = "stream/set"
kind = "write"
fanout = "allowed"  # operator-console fleet push (G2: explicit, deliberate)
request = "Command<StreamControl>"
reply = "Ack"
idempotent = false
since = "1.0"
description = "stream control: open_stream / close_stream / request_keyframe"
[[procedure]]
path = "stream/report"
kind = "write"
# NO `fanout`. The write default is "forbidden" (RFC 08 §2 G2), which is what we
# want here rather than a default we tolerate: a report is about one key on one
# host, and a fleet-wide spelling of it would be a viewer telling every host in
# the fleet about a stream one of them publishes. Leaving it off makes that
# unrepresentable rather than merely discouraged.
request = "MediaReceiverReport"
reply = "Ack"
# A report is a SNAPSHOT with cumulative counters, so a retry repeats a
# statement rather than adding to one (RFC 05 retry semantics).
idempotent = true
# The rate CEILING this producer enforces, per (consumer_id, stream, tier) --
# not the cadence a consumer should choose, which RFC 07 Section 1.1 puts at one
# per few seconds. Over-rate is refused with error/busy.
#
# NOTE: RFC 08 Section 2 scopes `rate` to `events` subjects and zenkey-build 0.7
# does not lint it on a procedure, so this field is unchecked here. It is not
# decoration: `introspect` serves this file verbatim, so the fleet can read it
# today, and a test pins it against the interval the sensor actually enforces.
# RFC 07 Section 1.1 asks for a procedure's rate to live in its registry entry;
# RFC 08 Section 2's field table has not caught up. Filed upstream.
rate = "burst(3600/h)"
since = "1.8"
description = "receiver feedback for one @media key (RFC 07 Section 1.1). INFORMS ONLY: this producer never re-tunes a tier from a report (RFC 07 Section 1.2) -- it keeps the latest per (consumer_id, stream, tier), ages entries out on idle_timeout_secs, and publishes {stream}/rx/{tier}/* aggregates"
# `{tier}` is a named bandwidth rung (low/medium/high) the viewer subscribes to
# exactly (RFC 07 §1, keyspace v1.3). It replaced the undefined `{profile}` chunk.
# cardinality: ~streams(16) × codecs(2) × tiers(3), rounded up.
[[media]]
path = "{stream}/video/{codec}/{tier}"
encoding = "video/*"
attachment = "FrameMeta"
cardinality = 128
since = "1.3"
[[media]]
path = "{stream}/preview/jpeg"
encoding = "image/jpeg"
attachment = "FrameMeta"
cardinality = 16
since = "1.0"

# The `@blob` plane (RFC 07 §2, RFC 08 §2 v1.8): every artifact-capable
# sensor runs the Tier-1 artifact channel (zblob BlobServer) and the Tier-2
# snapshot TreeServer/store. Endpoints list what the server actually serves:
# no `push` (never enabled — RFC 07 §2.2 keeps it off by default) and no
# `fanout` (zblob feature off; experimental since RFC 07 v1.17 demoted it to
# Appendix A). Shapes must agree app-wide (every producer
# declares the same three families); prose is per-producer.
[[blob]]
tier = "artifact"
endpoints = ["manifest", "slice", "have"]
reference = "ArtifactStatus"
since = "1.5"
description = "report bundles from the artifact channel"

[[blob]]
tier = "tree"
reference = "ArtifactStatus"
since = "1.5"
description = "snapshot directory indexes, keyed by their own root hash"

[[blob]]
tier = "store"
algo = "blake3"
reference = "ArtifactStatus"
since = "1.5"
description = "content-addressed chunks backing the snapshot trees"

[[subject]]
path = "applied/{topic}"
class = "state"
type = "AppliedConfig"
cardinality = 8
ttl_s = 900
since = "1.10"
description = "effective config actually in force for {topic} (#931): source file|desired|rpc, the effective doc, the last rejected desired doc"

# Operator-authored threshold rules (#931). Three writers — file, `@desired`,
# this pair — and one `applied/thresholds` marker that says which of them is
# actually in force. The set ships EMPTY: this build has no threshold that
# fires, only ones an operator chose.
[[procedure]]
path = "thresholds"
kind = "read"
reply = "ThresholdsConfig"
idempotent = true
since = "1.10"
description = "the threshold rule set currently evaluated against this producer's own telemetry"

[[procedure]]
path = "thresholds/set"
kind = "write"
fanout = "allowed"  # operator-console fleet push (G2: explicit, deliberate)
request = "ThresholdsConfig"
reply = "Ack"
since = "1.10"
description = "replace the threshold rule set; validated (metric globs, operators, durations, unique names) before apply — refuses with error/invalid-args and the previous set keeps running"
