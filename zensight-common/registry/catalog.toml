# Subject registry: @catalog (identity/ontology service). RFC 06, RFC 08 §2.
#
# `@catalog/state/claim/{zid}` is deliberately NOT registered, and that is not an
# oversight. It is a **liveliness token** — the correlator declares it with
# `session.liveliness().declare_token()` (zensight-correlator/src/guard.rs), so it
# carries no payload and is never `put`. The registry describes *data subjects*: a
# subject exists to say what a key's payload is and who may write it. A presence
# token has neither, which is why `alive` is a reserved leaf that build.rs refuses
# as a subject chunk at all. Registering `claim` would advertise a data surface that
# nothing serves — the mirror image of the advertised-but-unserved finding in #467.

[registry]
version = "1.5"
app = "zensight"
convention = 1

[service]
name = "catalog"
origin = "@catalog"
description = "identity/ontology service (zensight-correlator); single writer via the RFC 06 §5.3 claim protocol"

[[subject]]
path = "entity/{entity_id}"
common = "entity"
class = "state"
type = "HostEntity"
cardinality = 10000
ttl_s = 900
since = "1.0"
description = "merged entity document (LWW, tombstoned on retire/merge)"

[[subject]]
path = "alias/{old_id}"
common = "alias"
class = "state"
type = "AliasRecord"
cardinality = 1000
ttl_s = 31536000
since = "1.0"
description = "old-id -> entity-id re-pointing on merges/upgrades; operator-retained (RFC 06 §5.4)"

[[subject]]
path = "pdns/{ip_slug}"
common = "pdns"
class = "state"
type = "PdnsRecord"
cardinality = 100000
ttl_s = 86400
since = "1.0"
description = "accumulated IP<->name record; history = storage capture (RFC 06 §5.2; population-budgeted)"

[[subject]]
path = "edge/{edge_id}"
class = "state"
type = "Edge"
cardinality = 50000
ttl_s = 900
since = "1.3"
description = "resolved relationship between two endpoints (#915); the catalog's conclusion from evidence/relation claims, tombstoned when the last observer stops claiming it"

[[subject]]
path = "assertion/{id}"
class = "state"
type = "OperatorAssertion"
cardinality = 1000
ttl_s = 0
since = "1.1"
description = "operator identity assertion (link/unlink, RFC 06 §5.4); operator evidence — strong, never ages out"

[[procedure]]
path = "link"
kind = "write"
reply = "OperatorAssertion"
idempotent = true
since = "1.1"
description = "assert two origins are one host (?old=...;new=...); gated (RFC 06 §5.4)"

[[procedure]]
path = "unlink"
kind = "write"
reply = "OperatorAssertion"
idempotent = true
since = "1.1"
description = "assert two origins are NOT one host, retiring any link (?old=...;new=...); gated"

[[procedure]]
path = "names"
kind = "read"
reply = "Vec<NameVal>"
idempotent = true
since = "1.0"
description = "on-demand name resolution (?ip=...)"
[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.2"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"

# ── Incidents, acknowledgement and silence (#900) ─────────────────────────────
#
# All three used to live in one GUI process: an ack was a HashSet insert, a
# silence a HashMap insert beside it, an incident a pure function nobody else
# could call. Closing the window lost all three, a second GUI never saw them,
# and the Prometheus and OTel mirrors could not tell an acknowledged alert from
# a new one. They are documents now, which is also what lets a notifier read
# them without knowing anything about ZenSight.

[[subject]]
path = "incident/{incident_id}"
class = "state"
type = "Incident"
cardinality = 10000
ttl_s = 900
since = "1.4"
description = "firing alerts grouped by ENTITY (#922): inc-<entity_id>, or inc-<origin> where the origin resolves to no entity. Tombstoned when no member is firing. The timeline is history (the historian's and the GUI's), deliberately not carried here"

[[subject]]
path = "ack/{alert_ref}"
class = "state"
type = "AlertAck"
cardinality = 10000
ttl_s = 0
since = "1.4"
description = "an operator's acknowledgement of one firing alert, keyed <origin>.<producer>.<alert_key>. ttl_s = 0 because an ack is operator intent and never ages out; the catalog tombstones it on resolve and on a re-fire. Projection rule for every consumer: it applies only while a firing alert with timestamp <= fired_at exists, so an orphan is inert"

[[subject]]
path = "silence/{id}"
class = "state"
type = "Silence"
cardinality = 1000
ttl_s = 0
since = "1.4"
description = "a suppression window: matchers over origin/producer/source/rule/labels.*, with starts_at, ends_at and an author. Tombstoned at ends_at or by unsilence. Distinct from an ack — a silence holds across re-fires, which is what a maintenance window means"

[[procedure]]
path = "ack"
kind = "write"
reply = "AlertAck"
idempotent = true
since = "1.5"
description = "acknowledge a firing alert (?ref=<origin>.<producer>.<alert_key>&note=...); gated by the same switch as link/unlink. Refuses with error/catalog/not-firing when nothing is firing for that ref — an ack for a problem nobody has is a suppression waiting to happen"

[[procedure]]
path = "unack"
kind = "write"
reply = "AlertAck"
idempotent = true
since = "1.5"
description = "retire an acknowledgement (?ref=...); gated. Idempotent: unacking what is not acked is a no-op, not an error"

[[procedure]]
path = "silence"
kind = "write"
request = "Silence"
reply = "Silence"
since = "1.5"
description = "open a suppression window; gated. Validated before it applies (at least one matcher, ends_at after starts_at, every regex compiles) — an empty matcher set would otherwise mute the fleet"

[[procedure]]
path = "unsilence"
kind = "write"
reply = "Silence"
idempotent = true
since = "1.5"
description = "close a suppression window early (?id=<ulid>); gated"
