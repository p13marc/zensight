# Subject registry: pve (Proxmox VE). RFC 08 §2; issue #818.
#
# The hypervisor is the one machine whose failure is total, and it was
# monitored as a Linux box. What this slice adds is not more metrics — it is
# the CONFIGURATION FACTS that stopped matching intent, which is what the
# 2026-08-28 audit found by hand: a guest with onboot=0, a NIC with
# firewall=0 that made a whole firewall file inert, 990 GB provisioned on a
# 937 GB pool. None of those is a metric that spikes, so the real output is
# the state documents plus the alert set; the gauges exist so the hypervisor's
# card carries its guests and pools, Prometheus has series, and the
# family-coverage audit has families to cover.
#
# Guests are the <device>s in the KEY PATH (per-guest DeviceLiveness, the
# SNMP/gNMI shape) and in the identity evidence; the origin stays the polling
# host's. The payload `source` is the reporting host on every series and
# alert (#883) — a guest is a facet of this hypervisor, not a machine that
# publishes for itself — with the vmid, storage and node in the labels.
#
# THERE IS NO ACTION SURFACE, deliberately, and no procedure below can
# acquire one: a monitor that can stop a VM is a different threat model and
# would be a separate, explicit decision (the systemd sensor's `actions`
# block is the precedent for how that would have to look). The one write
# procedure below, `thresholds/set` (#931), rewrites the rule set this sensor
# evaluates against its OWN telemetry and reaches no cluster; `kind = "write"`
# there buys the #957 audit record for "who changed the rules".

[registry]
version = "1.3"
app = "zensight"
convention = 1

[producer]
name = "pve"
description = "Proxmox VE hypervisor telemetry (#818): guests + their onboot/firewall config, storage allocated-vs-capacity, vzdump outcomes and size trend, cluster/HA/replication — read-only, no action surface"

# ── Per-guest telemetry ──────────────────────────────────────────────────────

[[subject]]
path = "guest/{vmid}/cpu_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "guest CPU utilisation, 0..1 as PVE reports it (not per-core)"

[[subject]]
path = "guest/{vmid}/mem_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "guest memory in use"

[[subject]]
path = "guest/{vmid}/mem_max_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "guest memory ceiling"

[[subject]]
path = "guest/{vmid}/disk_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "guest disk in use, where the storage plugin can report it (0 on plugins that cannot)"

[[subject]]
path = "guest/{vmid}/disk_max_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "guest disk ceiling"

[[subject]]
path = "guest/{vmid}/provisioned_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "sum of this guest's declared disk sizes — what it has been promised, which is what over-commits a thin pool"

[[subject]]
path = "guest/{vmid}/uptime_secs"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "guest uptime (0 when stopped)"

[[subject]]
path = "guest/{vmid}/net_in_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 512
since = "1.3"
description = "cumulative bytes the guest has received (#1141). A COUNTER, monotonic since the guest booted and reset to zero by a stop/start — the rows carried it and this sensor dropped it, so \"which guest is saturating the uplink\" was a question the hypervisor could answer and ZenSight could not"

[[subject]]
path = "guest/{vmid}/net_out_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 512
since = "1.3"
description = "cumulative bytes the guest has sent (#1141); a counter, see net_in_bytes"

[[subject]]
path = "guest/{vmid}/disk_read_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 512
since = "1.3"
description = "cumulative bytes read from the guest's disks (#1141); a counter, see net_in_bytes"

[[subject]]
path = "guest/{vmid}/disk_write_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 512
since = "1.3"
description = "cumulative bytes written to the guest's disks (#1141); a counter, see net_in_bytes"

[[subject]]
path = "guest/{vmid}/running"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "1 when the guest is running, 0 otherwise — published every poll, so a stopped guest reads as 0 and never as silence"

# ── Per-pool telemetry ───────────────────────────────────────────────────────

[[subject]]
path = "storage/{store}/total_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.0"
description = "pool capacity"

[[subject]]
path = "storage/{store}/used_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.0"
description = "pool bytes actually consumed"

[[subject]]
path = "storage/{store}/avail_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.0"
description = "pool bytes free"

[[subject]]
path = "storage/{store}/used_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.0"
description = "used/total, 0..1"

[[subject]]
path = "storage/{store}/allocated_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.0"
description = "sum of the declared sizes of the volumes this pool holds — the number that is invisible in `used` and fills the pool on its own schedule"

[[subject]]
path = "storage/{store}/overcommit_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.0"
description = "allocated/total; above 1.0 the pool is over-committed (990 GB on a 937 GB pool = 1.06)"

# ── Per-guest backup telemetry ───────────────────────────────────────────────

[[subject]]
path = "backup/{vmid}/size_bytes"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "newest stored dump size for this guest"

[[subject]]
path = "backup/{vmid}/size_change_pct"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "newest vs previous dump, percent; negative means it shrank — the one a green exit code cannot show"

[[subject]]
path = "backup/{vmid}/age_secs"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "age of the newest stored dump"

[[subject]]
path = "backup/{vmid}/duration_secs"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "how long the last vzdump task ran"

[[subject]]
path = "backup/{vmid}/ok"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.0"
description = "1 when the last vzdump task exited OK, 0 otherwise"

# ── Per-node telemetry (#1141) ───────────────────────────────────────────────
#
# The hypervisor itself, which this sensor did not see for two releases: it
# reported guests and pools while a node swapping, or with a full rootfs, or
# with a load average four times its core count, was invisible. Gauges only
# where the node gave a reading — a field this build does not find is a MISSING
# reading, not a zero, and PVE's node-status shape has moved across releases.

[[subject]]
path = "node/{node}/cpu_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.3"
description = "node CPU utilisation, 0..1 as PVE reports it — not per-core, the same convention guest/{vmid}/cpu_ratio uses"

[[subject]]
path = "node/{node}/mem_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 64
since = "1.3"
description = "node memory in use"

[[subject]]
path = "node/{node}/mem_total_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 64
since = "1.3"
description = "node memory installed"

[[subject]]
path = "node/{node}/swap_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 64
since = "1.3"
description = "node swap in use — a hypervisor that has started swapping is the reading a guest's own numbers cannot show; absent on a node with no swap configured, which is a deliberate configuration rather than zero"

[[subject]]
path = "node/{node}/rootfs_used_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.3"
description = "the node's ROOT filesystem, not a storage pool. A full / stops PVE writing its own state and is invisible in every pool's numbers"

[[subject]]
path = "node/{node}/rootfs_bytes"
class = "telemetry"
type = "TelemetryPoint"
unit = "By"
cardinality = 64
since = "1.3"
description = "node root filesystem in use"

[[subject]]
path = "node/{node}/load1"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.3"
description = "1-minute load average as the node reports it"

[[subject]]
path = "node/{node}/load_per_cpu"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 64
since = "1.3"
description = "load1 divided by the node's CPU count — the number that means the same thing across nodes of different sizes; absent when either half is"

[[subject]]
path = "node/{node}/uptime_secs"
class = "telemetry"
type = "TelemetryPoint"
unit = "s"
cardinality = 64
since = "1.3"
description = "seconds since the node booted"

# ── Ceph telemetry (#1141) ───────────────────────────────────────────────────
#
# Absent on every cluster that does not run Ceph, which is most of them: the
# endpoint answers 501 or 404, and that is a fact about the cluster rather than
# a failed poll.

[[subject]]
path = "ceph/healthy"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.3"
description = "1 when Ceph's OWN health enum is HEALTH_OK, 0 otherwise — never a verdict this sensor derived from the counters beside it"

[[subject]]
path = "ceph/osds_up"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.3"
description = "OSDs Ceph reports up"

[[subject]]
path = "ceph/osds_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.3"
description = "OSDs in the map"

[[subject]]
path = "ceph/pgs_degraded"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.3"
description = "placement groups not in active+clean, summed over every state that is not — the only reading that survives Ceph adding a state name"

[[subject]]
path = "ceph/used_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.3"
description = "bytes_used / bytes_total as the pg map reports them"

# ── Cluster-wide telemetry ───────────────────────────────────────────────────

[[subject]]
path = "cluster/quorate"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "1 quorate, 0 not; not published at all on a standalone node, where there is no quorum to have"

[[subject]]
path = "cluster/nodes_online"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "cluster members reporting online"

[[subject]]
path = "cluster/nodes_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "cluster members known"

[[subject]]
path = "cluster/guests_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "guests known to this hypervisor (templates excluded)"

[[subject]]
path = "cluster/guests_running"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "guests currently running"

[[subject]]
path = "cluster/replication_failed"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 1
since = "1.0"
description = "replication jobs whose last run failed (0 where replication is unconfigured)"

[[subject]]
path = "backup/job/{node}/ok"
class = "telemetry"
type = "TelemetryPoint"
unit = "1"
cardinality = 32
since = "1.1"
description = "1 when the last whole-job vzdump on this node exited OK, 0 when it did not"

[[subject]]
path = "backup/job/{node}/duration_secs"
class = "telemetry"
type = "TelemetryPoint"
unit = "s"
cardinality = 32
since = "1.1"
description = "how long the last whole-job vzdump on this node took"

# ── State documents ──────────────────────────────────────────────────────────

[[subject]]
path = "guest/{vmid}"
class = "state"
type = "PveGuest"
cardinality = 512
ttl_s = 900
since = "1.0"
description = "the guest as the hypervisor knows it: runtime status joined with the config facts that decide the NEXT reboot — onboot, per-NIC firewall, per-disk backup exclusion"

[[subject]]
path = "storage/{store}"
class = "state"
type = "PveStoragePool"
cardinality = 128
ttl_s = 900
since = "1.0"
description = "pool capacity, use, and what has been PROMISED to thin volumes"

[[subject]]
path = "backup/{vmid}"
class = "state"
type = "PveBackupSummary"
cardinality = 512
ttl_s = 86400
since = "1.0"
description = "last vzdump task outcome plus the newest two stored volumes — the size comparison comes from the store, so a sensor restart does not reset the baseline"

[[subject]]
path = "backup/job/{node}"
class = "state"
type = "PveBackupJob"
cardinality = 32
ttl_s = 86400
since = "1.1"
description = "the last WHOLE-JOB vzdump run on this node — a job configured `all 1` covers every guest and names none, so PVE records it as one task with an empty id and the per-guest results live only in the task log; grading it once beats inventing a per-guest verdict (#880)"

[[subject]]
path = "node/{node}"
class = "state"
type = "PveNode"
cardinality = 64
ttl_s = 900
since = "1.3"
description = "one node's own resource picture (#1141): CPU, memory, swap, root filesystem, load averages, uptime, PVE and kernel versions — the hypervisor this sensor did not see while it reported every guest running on it"

[[subject]]
path = "backup/job/{job}/schedule"
class = "state"
type = "PveBackupSchedule"
cardinality = 64
ttl_s = 900
since = "1.3"
description = "one scheduled vzdump job (#1141): its calendar spec verbatim, whether it is ENABLED, and PVE's own next-run. Without it the sensor could say \"the last backup ran N seconds ago\" and not \"a backup that should have run at 03:00 did not run at all\" — a job switched off looks identical to one that is merely young"

[[subject]]
path = "ceph"
class = "state"
type = "PveCephStatus"
cardinality = 1
ttl_s = 900
since = "1.3"
description = "Ceph's own health verdict and the checks it is raising (#1141), where the cluster runs Ceph; absent entirely where it does not"

[[subject]]
path = "cluster"
class = "state"
type = "PveClusterHealth"
cardinality = 1
ttl_s = 900
since = "1.0"
description = "quorum, members, HA resources and replication results; quorate is absent on a standalone node rather than false"

[[subject]]
path = "evidence/relation/{relation_id}"
common = "evidence_relation"
class = "state"
type = "RelationshipEvidence"
cardinality = 1024
ttl_s = 900
since = "1.1"
description = "a Hosts claim: this node hosts this guest (#915); the catalog resolves both ends into an @catalog edge"

[[subject]]
path = "evidence/device/{device}"
common = "evidence_device"
class = "state"
type = "HostEvidence"
cardinality = 512
ttl_s = 900
since = "1.0"
description = "third-party identity claim about a guest (observer = pve; {device} is the vmid): its name and configured MACs, so the hypervisor's view of a VM fuses with that VM's own sensors in the catalog (RFC 06 §4)"

# ── Framework subjects ───────────────────────────────────────────────────────

[[subject]]
path = "health"
common = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework)"

[[subject]]
path = "errors"
common = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
common = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
common = "evidence_self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim of the host running the sensor (RFC 06 §4)"

[[subject]]
path = "alert/{alert_key}"
common = "alert"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 128
ttl_s = 900
since = "1.0"
description = "hypervisor assertions: onboot-off, NIC firewall off, guest not running, pool usage/over-commitment, backup failed/stale/shrunk, quorum lost, replication failed"

# ── Procedures ───────────────────────────────────────────────────────────────

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.0"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"

[[subject]]
path = "applied/{topic}"
class = "state"
type = "AppliedConfig"
cardinality = 8
ttl_s = 900
since = "1.2"
description = "effective config actually in force for {topic} (#931): source file|desired|rpc, the effective doc, the last rejected desired doc"

# Operator-authored threshold rules (#931). Three writers — file, `@desired`,
# this pair — and one `applied/thresholds` marker that says which of them is
# actually in force. The set ships EMPTY: this build has no threshold that
# fires, only ones an operator chose.
[[procedure]]
path = "thresholds"
kind = "read"
reply = "ThresholdsConfig"
idempotent = true
since = "1.2"
description = "the threshold rule set currently evaluated against this producer's own telemetry"

[[procedure]]
path = "thresholds/set"
kind = "write"
fanout = "allowed"  # operator-console fleet push (G2: explicit, deliberate)
request = "ThresholdsConfig"
reply = "Ack"
since = "1.2"
description = "replace the threshold rule set; validated (metric globs, operators, durations, unique names) before apply — refuses with error/invalid-args and the previous set keeps running"
