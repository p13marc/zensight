# ── Gated PDU outlet control (#956, SYS-SUP-003) ─────────────────────────────
#
# The FIRST write surface outside `systemd`, and it is a bigger step than
# restarting a unit: a monitor that can cut power is a different threat model —
# the sentence `pve` and `bmc` use to justify having no action surface at all.
#
# Declared UNCONDITIONALLY and answering `error/gated` when the switch is shut
# (#648): "off" has to be an answer rather than a silence, or a caller cannot
# tell a read-only deployment from an offline one. `action/capability` is
# served first and always, so a frontend can render the gate before anyone
# clicks.

[[procedure]]
path = "action/set"
kind = "write"
fanout = "allowed"  # zenctl fleet push (G2); the GUI is strictly origin-scoped
request = "OutletAction"
reply = "OutletStatus"
idempotent = false
since = "1.12"
description = "gated PDU outlet cycle {device,outlet} — default OFF, allowlist plus a SEPARATE write credential plus a PDU profile whose control OIDs are verified; refuses with error/gated, and BOTH outcomes reach the host audit trail (#957). There is no polkit here and the bus caller is anonymous: the honest description is anyone who can reach the bus and whose target is on the allowlist"

[[procedure]]
path = "action"
kind = "read"
reply = "OutletStatus"
idempotent = true
since = "1.12"
description = "the most recent outcome, or null when nothing has run — null rather than an empty status, which reads exactly like a refusal"

[[procedure]]
path = "actions"
kind = "read"
reply = "Vec<OutletStatus>"
idempotent = true
since = "1.12"
description = "bounded ring of recent outcomes (operator audit timeline; the durable trail is the host's audit subsystem, #957)"

[[procedure]]
path = "action/capability"
kind = "read"
reply = "OutletCapability"
idempotent = true
since = "1.12"
description = "outlet-control gate state: the switch, the allowlist and the reason nothing is permitted when nothing is. Served even when actions are disabled, so 'off' is an answer and not a silence"

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.1"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"

[[procedure]]
path = "artifact/request"
kind = "write"
request = "ArtifactRequest"
reply = "ArtifactAck"
since = "1.0"
description = "initiate artifact generation; replies { id } immediately (RFC 05 §3)"

[[procedure]]
path = "artifact/cancel"
kind = "write"
reply = "Ack"
since = "1.0"
description = "free an in-flight/ready artifact early (?id=<ulid>)"

[[procedure]]
path = "artifact/status"
kind = "read"
reply = "ArtifactStatus"
idempotent = true
since = "1.0"
description = "advertised artifact kinds + the in-flight/ready state per kind (RFC 05 §3)"

# The `@blob` plane (RFC 07 §2, RFC 08 §2 v1.8): every artifact-capable
# sensor runs the Tier-1 artifact channel (zblob BlobServer) and the Tier-2
# snapshot TreeServer/store. Endpoints list what the server actually serves:
# no `push` (never enabled — RFC 07 §2.2 keeps it off by default) and no
# `fanout` (zblob feature off; experimental since RFC 07 v1.17 demoted it to
# Appendix A). Shapes must agree app-wide (every producer
# declares the same three families); prose is per-producer.
[[blob]]
tier = "artifact"
endpoints = ["manifest", "slice", "have"]
reference = "ArtifactStatus"
since = "1.7"
description = "report bundles from the artifact channel"

[[blob]]
tier = "tree"
reference = "ArtifactStatus"
since = "1.7"
description = "snapshot directory indexes, keyed by their own root hash"

[[blob]]
tier = "store"
algo = "blake3"
reference = "ArtifactStatus"
since = "1.7"
description = "content-addressed chunks backing the snapshot trees"
