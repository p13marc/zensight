# ── Families the shipped profiles have always published (#955) ───────────────
#
# Not new telemetry: `generic-device`, `entity-sensors` and `network-interfaces`
# have emitted these since #531. They were riding the `{device}/{metric...}`
# catch-all, which is exactly the blind spot the catch-all creates — the metric
# guard passes any grammar-valid name, so nothing noticed. Registering them
# gives the exporters a type and a help string, and it is what makes
# `registry_conformance`'s profile-coverage test start from zero excuses.

