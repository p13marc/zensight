# ── NAS appliances (#960, the appliance half of SYS-SUP-014) ─────────────────
#
# The CLIENT side of a NAS is already covered elsewhere: `hostspec` asserts the
# mount is present with the right options, `sysinfo` publishes per-mount space,
# inodes and time-to-full, `probe` checks the service answers. These families
# are the appliance — array and disk health that no client-side sensor can see
# — and they sit on top of `host-resources`, not instead of it, so an appliance
# whose vendor MIB is switched off still reports its capacity.
#
# `nas/array/*` is Synology's RAID group and `nas/pool/*` is TrueNAS's ZFS
# pool: separate families because the columns are genuinely different (a pool
# reports used and size in ITS OWN allocation units, a RAID group reports free
# and total in bytes), and one family with half its columns absent per vendor
# would tell a consumer less, not more.

[[subject]]
path = "{device}/nas/system/status"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.11"
description = "Synology systemStatus: Normal(1) Failed(2) — Failed means a volume has crashed"

