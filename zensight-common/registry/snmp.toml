# ── UPS and PDU (#955, SYS-SUP-002 and the read half of -003) ────────────────
#
# Registered as real families rather than left to the `{device}/{metric...}`
# catch-all above, for the reason the note at the top of this file gives: a
# catch-all makes the metric guard vacuous and gives an exporter no `# TYPE`
# and no help text. These are OUR vocabulary — RFC 1628 is a standard and the
# three PDU trees are normalised onto one set of names — not an OID tree a
# vendor owns.
#
# Two conventions worth knowing before adding to this block:
#
#   * A scale in the NAME, never in the value. `voltage_dv` is decivolts
#     because that is what RFC 1628 puts on the wire; rescaling it in the
#     poller would need a per-OID scale table, and a scale applied in the
#     wrong place is a wrong number nobody can see. Milliamps and tenths of an
#     amp are separate families for the same reason — summing them would be
#     silently meaningless.
#   * `{outlet}` is the table index VERBATIM. An Eaton ePDU indexes its outlet
#     tables by `unit.outlet`, so a legal outlet id is `1.3` as well as `3`.

[[subject]]
path = "{device}/ups/ident/manufacturer"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 128
since = "1.10"
description = "UPS manufacturer name (upsIdentManufacturer)"

[[subject]]
