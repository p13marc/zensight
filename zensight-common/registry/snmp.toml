# Subject registry: snmp (device poller). RFC 08 §2; migration epic #453.
# Telemetry metric trees register as {metric...} families (one payload type,
# TelemetryPoint) — typed per-metric refinement is additive (registry MINOR).

[registry]
version = "1.7"
app = "zensight"
convention = 1

[producer]
name = "snmp"
description = "SNMP device poller (proxy producer: observed device = first subject chunk)"

[[subject]]
path = "{device}/{metric...}"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 10000
since = "1.0"
description = "polled device metric tree"
[[subject]]
path = "health"
common = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework; absorbs the legacy @/status running flag)"

[[subject]]
path = "errors"
common = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
common = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
common = "evidence_self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim (RFC 06 §4)"

[[subject]]
path = "{device}/interfaces"
class = "state"
type = "InterfaceTable"
cardinality = 64
ttl_s = 300
since = "1.3"
description = "joined ifTable/ifXTable state doc per polled device (#529): decoded statuses, HC-preferred counters, derived rates"

[[subject]]
path = "evidence/device/{device}"
common = "evidence_device"
class = "state"
type = "HostEvidence"
cardinality = 64
ttl_s = 900
since = "1.5"
description = "observed-device identity claim (#537): sysName/sysDescr/sysObjectID + MAC/IP walks, observer role (RFC 06 §4)"

[[subject]]
path = "discovery"
class = "state"
type = "DiscoveryReport"
ttl_s = 7200
since = "1.6"
description = "subnet-discovery report (#541): unconfigured SNMP responders, proposed for onboarding (opt-in sweep)"

[[subject]]
path = "{device}/trap/{id}"
class = "events"
type = "EventRecord"
rate = "burst(1000/h)"
cardinality = 100000
since = "1.4"
description = "translated trap/inform records (#535): durable append-only events, one ULID key per notification"

[[subject]]
path = "alert/{alert_key}"
common = "alert"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 64
ttl_s = 900
since = "1.2"
description = "threshold alerts for polled devices (#528): unreachable, interface down/errors/utilization, reboot, host resources"

[[subject]]
path = "artifact/{kind}"
class = "state"
type = "ArtifactStatus"
cardinality = 16
ttl_s = 900
since = "1.1"
description = "per-kind artifact progress (framework: V1Context::artifact_status_key)"

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.1"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"

[[procedure]]
path = "artifact/request"
kind = "write"
request = "ArtifactRequest"
reply = "ArtifactAck"
since = "1.0"
description = "initiate artifact generation; replies { id } immediately (RFC 05 §3)"

[[procedure]]
path = "artifact/cancel"
kind = "write"
reply = "Ack"
since = "1.0"
description = "free an in-flight/ready artifact early (?id=<ulid>)"

[[procedure]]
path = "artifact/status"
kind = "read"
reply = "ArtifactStatus"
idempotent = true
since = "1.0"
description = "advertised artifact kinds + the in-flight/ready state per kind (RFC 05 §3)"

# The `@blob` plane (RFC 07 §2, RFC 08 §2 v1.8): every artifact-capable
# sensor runs the Tier-1 artifact channel (zblob BlobServer) and the Tier-2
# snapshot TreeServer/store. Endpoints list what the server actually serves:
# no `push` (never enabled — RFC 07 §2.2 keeps it off by default) and no
# `fanout` (zblob feature off). Shapes must agree app-wide (every producer
# declares the same three families); prose is per-producer.
[[blob]]
tier = "artifact"
endpoints = ["manifest", "slice", "have"]
reference = "ArtifactStatus"
since = "1.7"
description = "report bundles from the artifact channel"

[[blob]]
tier = "tree"
reference = "ArtifactStatus"
since = "1.7"
description = "snapshot directory indexes, keyed by their own root hash"

[[blob]]
tier = "store"
algo = "blake3"
reference = "ArtifactStatus"
since = "1.7"
description = "content-addressed chunks backing the snapshot trees"
