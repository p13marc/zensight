# Subject registry: snmp (device poller). RFC 08 §2; migration epic #453.
# Telemetry metric trees register as {metric...} families (one payload type,
# TelemetryPoint) — typed per-metric refinement is additive (registry MINOR).

[registry]
version = "1.9"
app = "zensight"
convention = 1

[producer]
name = "snmp"
description = "SNMP device poller (proxy producer: observed device = first subject chunk)"

[[subject]]
path = "{device}/{metric...}"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 10000
since = "1.0"
description = "polled device metric tree"

# The interface table, registered column by column (#779).
#
# Everything else this poller emits still rides the catch-all above, whose
# metric tail is defined by the polled device. That catch-all has NO literal
# chunks, so the exporters' family rule (#764) has nothing to name from and
# falls back to the rest variable's *value* — which leaves the table index in
# the metric name (`zensight_snmp_if_1_in_octets`) and makes
# `sum by (index)` unwritable. #769 already attached the index as a label; these
# patterns are the other half, and once a key matches one of them the generic
# rule takes over with no special case.
#
# One subject per column, NOT `{device}/if/{index}/{column}`. A single
# {column} variable would be dropped from the family name along with the
# others, collapsing seventeen columns into one `zensight_snmp_if` family whose
# members are counters, gauges and strings at once — two `# TYPE` lines for one
# name, which is the scrape-killer class #752 fixed. Column-per-subject is also
# how every other per-entity tree in this registry set is spelled
# (`iface/{iface}/rx_bytes`, `disk/{mount}/total`).
#
# The `.rate` siblings are registered because the poller derives one for every
# counter (`publish` in zensight-sensor-snmp/src/poller.rs); an unregistered
# sibling would silently fall back to the catch-all and stay unaggregatable.
#
# ifTable and ifXTable are one table split across two MIB modules — the same
# split `zensight-common/src/interfaces.rs` joins for the InterfaceTable state
# doc. The other three indexed tables — hrProcessorTable, ipAddrTable and
# hrStorageTable — are registered the same way further down (#783); everything
# else this poller can emit still rides the catch-all.

[[subject]]
path = "{device}/if/{index}/index"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 4096
since = "1.8"
description = "interface index (ifIndex)"

[[subject]]
path = "{device}/if/{index}/descr"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 4096
since = "1.8"
description = "interface description (ifDescr)"

