since = "2.0"
reason = "the producer chunk already names the producer (#470)"

[[deprecated]]
path = "logs/by_severity/{severity}"
since = "2.0"
reason = "the producer chunk already names the producer (#470)"

[[deprecated]]
path = "logs/errors_total"
since = "2.0"
