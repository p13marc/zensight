# Subject registry: logs (syslog + journald). RFC 08 §2; migration epic #453.
# Telemetry is registered as real subjects, not a `{metric...}` catch-all
# (issue #468) — see registry/sysinfo.toml for the rule and why.
# Source: src/derived.rs, src/ingest.rs, src/template.rs.
#
# The doubled `logs/` head (`telemetry/logs/logs/...`) is FIXED (#470): the
# subject paths below no longer repeat the producer name, because the sensor's
# metric names no longer do. `logs` was the only producer that prefixed its
# metric names with its own name — the producer chunk already says it.
#
# This renamed the exported Prometheus/OTel series (they derive from
# `point.metric`, not the key): `zensight_logs_logs_errors_total` is now
# `zensight_logs_errors_total`. See CHANGELOG.
#
# `events/{uid}` (src/receiver.rs) is NOT registered: it is never published,
# it only feeds the bounded `@rpc/logs/events` ring (src/main.rs).

[registry]
version = "2.0"
app = "zensight"
convention = 1

[producer]
name = "logs"
description = "unified logs sensor; per-line detail is pull-only (RFC 04 R3)"

[[subject]]
path = "ingest/received_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "lines received"

[[subject]]
path = "ingest/parsed_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "lines parsed"

[[subject]]
path = "ingest/parse_failed_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "lines that failed to parse"

[[subject]]
path = "ingest/dropped_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "lines dropped"

[[subject]]
path = "by_severity/{severity}"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 16
since = "1.1"
description = "lines by syslog severity; the leaf is `<severity>_total`"

[[subject]]
path = "errors_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "error-severity lines"

[[subject]]
path = "warnings_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "warning-severity lines"

[[subject]]
path = "units_in_failure"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "units currently in a failure state per the log stream"

[[subject]]
path = "journald/read_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "journald entries read"

[[subject]]
path = "journald/published_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "entries published"

[[subject]]
path = "journald/dropped_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "entries dropped"

[[subject]]
path = "journald/sampled_out_total"
class = "telemetry"
type = "TelemetryPoint"
since = "1.1"
description = "entries sampled out"

[[subject]]
path = "by_unit/{unit}/messages_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 256
since = "1.1"
description = "lines from this unit"

[[subject]]
path = "by_unit/{unit}/errors_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 256
since = "1.1"
description = "error lines from this unit"

[[subject]]
path = "by_unit/{unit}/error_ratio"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 256
since = "1.1"
description = "error share for this unit"

[[subject]]
path = "by_unit/{unit}/burn_rate"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 256
since = "1.1"
description = "error burn rate for this unit"

[[subject]]
path = "by_template/{template}/count_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.1"
description = "lines matching this template"

[[subject]]
path = "by_template/{template}/errors_total"
class = "telemetry"
type = "TelemetryPoint"
cardinality = 512
since = "1.1"
description = "error lines matching this template"

[[subject]]
path = "health"
common = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "sensor health document (framework; absorbs the legacy @/status running flag)"

[[subject]]
path = "errors"
common = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
common = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
common = "evidence_self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim (RFC 06 §4)"

[[subject]]
path = "alert/{alert_key}"
common = "alert"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 64
ttl_s = 900
since = "1.0"
description = "alerts; firing->resolved on one key, delete = tombstone"
[[subject]]
path = "artifact/{kind}"
class = "state"
type = "ArtifactStatus"
cardinality = 16
ttl_s = 900
since = "1.1"
description = "per-kind artifact progress (framework: V1Context::artifact_status_key)"

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "artifact/request"
kind = "write"
request = "ArtifactRequest"
reply = "ArtifactAck"
since = "1.0"
description = "initiate artifact generation; replies { id } immediately (RFC 05 §3)"

[[procedure]]
path = "artifact/cancel"
kind = "write"
reply = "Ack"
since = "1.0"
description = "free an in-flight/ready artifact early (?id=<ulid>)"

[[procedure]]
path = "artifact/status"
kind = "read"
reply = "ArtifactStatus"
idempotent = true
since = "1.0"
description = "advertised artifact kinds + the in-flight/ready state per kind (RFC 05 §3)"
[[procedure]]
path = "events"
kind = "read"
reply = "Vec<LogRecord>"
idempotent = true
since = "1.0"
description = "bounded log ring, newest first (?since=;max=;source= — source filters the observed device, a central receiver holds many)"
[[procedure]]
path = "filter"
kind = "read"
reply = "TopicStatus"
idempotent = true
since = "1.0"
description = "current filter configuration (dynamic message filters)"

[[procedure]]
path = "filter/set"
kind = "write"
request = "TopicConfig"
reply = "Ack"
since = "1.0"
description = "apply filter configuration (dynamic message filters)"

# ── Retired (#470) ─────────────────────────────────────────────────────────
# The doubled `logs/` head. Every path below moved to the same path without it
# (`logs/errors_total` -> `errors_total`): the producer chunk already says
# "logs", so repeating it in the subject was noise on every key, and no other
# producer did it.
#
# Recorded here rather than deleted, because RFC 08 §3 forbids ever re-using a
# retired path — and `introspect` must be able to tell a consumer that a key it
# remembers is gone, not merely absent.

[[deprecated]]
path = "logs/ingest/received_total"
since = "2.0"
reason = "the producer chunk already names the producer (#470)"

[[deprecated]]
path = "logs/ingest/parsed_total"
since = "2.0"
reason = "the producer chunk already names the producer (#470)"

[[deprecated]]
