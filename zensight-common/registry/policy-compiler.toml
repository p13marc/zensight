# Subject registry: the fleet policy compiler's HOST-ORIGIN producer identity.
# RFC 08 §2; issue #1202.
#
# `zensight-desired` is `@desired` — a single-writer SERVICE origin (#938),
# whose registry is `desired.toml`, and `desired` cannot also be a producer
# name: zenkey-build generates one module per registry name. So the process
# identity is `policy-compiler`, the crate's own description of itself. Only
# the `run` subcommand is a producer; `plan`, `apply` and `render` are
# one-shot commands and publish no framework document.
#
# It runs no command and reaches no host; the alert it can raise is the
# framework's `sensor-budget`, about itself.

[registry]
version = "1.0"
app = "zensight"
convention = 1

[producer]
name = "policy-compiler"
description = "the fleet policy compiler's process identity (#1202): the host-origin producer beside the `@desired` service origin — health, budget and shed ladder for the `run` daemon that compiles `fleet-policy.json5` into per-host `@desired` documents"

# ── Framework subjects ───────────────────────────────────────────────────────
#
# There is no state-free producer and there cannot be: SensorRunner emits all
# five of these unconditionally, so declaring fewer would be an RFC 08 §6.1
# lie about what this build serves.

[[subject]]
path = "health"
common = "health"
class = "state"
type = "HealthSnapshot"
ttl_s = 120
since = "1.0"
description = "process health (framework); its self_stats carry RSS against the declared budget"

[[subject]]
path = "errors"
common = "errors"
class = "state"
type = "ErrorReport"
ttl_s = 300
since = "1.0"
description = "rolling error window (framework)"

[[subject]]
path = "sensor"
common = "sensor"
class = "state"
type = "SensorInfo"
ttl_s = 900
since = "1.0"
description = "registration document: identity, version, capabilities (framework, 60 s re-emit)"

[[subject]]
path = "evidence/self"
common = "evidence_self"
class = "state"
type = "HostEvidence"
ttl_s = 900
since = "1.0"
description = "self-identity claim of the host running this policy compiler (framework, RFC 06 §4)"

[[subject]]
path = "alert/{alert_key}"
common = "alert"
class = "state"
type = "Alert"
qos = "alert"
cardinality = 32
ttl_s = 900
since = "1.0"
description = "framework `sensor-budget`: the declared resource budget is being approached or exceeded"

# ── Procedures ───────────────────────────────────────────────────────────────

[[procedure]]
path = "introspect"
kind = "read"
reply = "RegistrySlice"
idempotent = true
since = "1.0"
description = "the registry slice this build serves (RFC 08 §6)"

[[procedure]]
path = "describe"
kind = "read"
fanout = "allowed"
reply = "SchemaSet"
idempotent = true
since = "1.0"
description = "payload self-description: the SchemaSet JSON for every type this slice references (RFC 08 §7)"
